<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turbo Fútbol</title>
<style>
  :root {
    --azul: #2f8cff;
    --azul-osc: #0d3f8f;
    --naranja: #ff8a1f;
    --naranja-osc: #8f3f06;
    --tinta: #eef3ff;
    --panel: rgba(8, 14, 30, 0.86);
    --borde: rgba(140, 180, 255, 0.28);
    --acento: #ffd24a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #04060c; color: var(--tinta); overflow: hidden;
    font-family: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  #juego { position: fixed; inset: 0; }
  #juego canvas { display: block; width: 100%; height: 100%; outline: none; }
  .oculto { display: none !important; }

  /* Panel de error: nunca pantalla negra */
  #tf-error { position: fixed; inset: 0; z-index: 9999; display: none; background: rgba(10, 4, 8, 0.96);
    color: #ffe9ea; padding: 32px; overflow: auto; font-family: ui-monospace, Menlo, Consolas, monospace; }
  #tf-error h1 { font-family: "Segoe UI", Arial, sans-serif; color: #ff6b6b; margin: 0 0 12px; font-size: 26px; }
  #tf-error .msg { font-size: 16px; white-space: pre-wrap; margin-bottom: 16px; color: #fff; }
  #tf-error pre { white-space: pre-wrap; font-size: 12px; color: #ffb3b8; background: rgba(255,255,255,0.05);
    padding: 12px; border-radius: 8px; border: 1px solid rgba(255,120,120,0.25); }
  #tf-error button { margin-top: 12px; padding: 10px 18px; font-size: 15px; border-radius: 8px; border: 0;
    background: #ff6b6b; color: #200; font-weight: 700; cursor: pointer; }

  /* Pantalla de carga */
  #carga { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    gap: 14px; z-index: 50; background: radial-gradient(ellipse at 50% 40%, #13244a 0%, #04060c 70%); }
  #carga .titulo { font-size: 44px; font-weight: 900; font-style: italic; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--azul), #fff 50%, var(--naranja)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #carga .sub { opacity: 0.7; font-size: 15px; }

  /* Overlay de depuración (F3) */
  #debug { position: fixed; left: 10px; top: 10px; z-index: 40; background: rgba(0,0,0,0.62); padding: 8px 10px;
    border-radius: 6px; font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; color: #b8ffb8; pointer-events: none;
    white-space: pre; min-width: 260px; }


  /* ---------------- HUD ---------------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 20; }
  #marcador { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); display: flex; align-items: stretch;
    font-weight: 900; font-style: italic; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.45)); }
  #marcador .equipo { display: flex; align-items: center; gap: 12px; padding: 6px 18px; min-width: 150px; }
  #marcador .azul { background: linear-gradient(90deg, rgba(20,70,170,0.2), rgba(35,110,255,0.92)); justify-content: flex-end;
    clip-path: polygon(8% 0, 100% 0, 100% 100%, 0 100%); border-radius: 8px 0 0 8px; }
  #marcador .naranja { background: linear-gradient(270deg, rgba(170,70,10,0.2), rgba(255,130,25,0.92));
    clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%); border-radius: 0 8px 8px 0; }
  #marcador .nombre { font-size: 13px; letter-spacing: 2px; opacity: 0.9; }
  #marcador .goles { font-size: 38px; line-height: 1; min-width: 34px; text-align: center; text-shadow: 0 2px 0 rgba(0,0,0,0.35); }
  #marcador .reloj { background: rgba(6,10,22,0.92); padding: 6px 20px 4px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-width: 124px; border-top: 3px solid rgba(255,255,255,0.12); }
  #reloj { font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
  #reloj.te { color: var(--acento); }
  #reloj-sub { font-size: 10px; letter-spacing: 2px; opacity: 0.7; margin-top: 2px; font-style: normal; font-weight: 700; }
  #anuncio { position: absolute; top: 30%; left: 0; right: 0; text-align: center; font-weight: 900; font-style: italic;
    font-size: 110px; letter-spacing: 3px; opacity: 0; transform: scale(0.8); transition: opacity 0.18s, transform 0.25s;
    text-shadow: 0 6px 30px rgba(0,0,0,0.55), 0 0 40px rgba(255,255,255,0.25); }
  #anuncio.visible { opacity: 1; transform: scale(1); }
  #anuncio .det { display: block; font-size: 22px; letter-spacing: 1px; font-style: normal; font-weight: 700; margin-top: 8px; opacity: 0.92; }
  #anuncio.azul { color: #8fc2ff; } #anuncio.naranja { color: #ffc27a; }
  #aviso { position: absolute; top: 58%; left: 0; right: 0; text-align: center; font-weight: 900; font-style: italic; font-size: 34px;
    letter-spacing: 2px; opacity: 0; transition: opacity 0.2s, transform 0.2s; transform: translateY(10px); text-shadow: 0 3px 14px rgba(0,0,0,0.6); }
  #aviso.visible { opacity: 1; transform: translateY(0); }
  #aviso.demo { color: #ff6060; } #aviso.tiro { color: #ffe27a; } #aviso.salvada { color: #7affc0; } #aviso.info { color: #fff; font-size: 24px; }
  #feed { position: absolute; top: 90px; right: 16px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
  #feed .item { background: rgba(6,10,22,0.78); padding: 6px 12px; border-radius: 6px; font-size: 14px; font-weight: 700;
    border-left: 4px solid #fff; animation: entra 0.25s ease-out; }
  #feed .item.t0 { border-left-color: var(--azul); } #feed .item.t1 { border-left-color: var(--naranja); }
  #feed .item .n0 { color: #8fc2ff; } #feed .item .n1 { color: #ffc27a; }
  @keyframes entra { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: none; } }
  #turbo-medidor { position: absolute; right: 28px; bottom: 26px; width: 150px; height: 150px; }
  #turbo-medidor svg { width: 100%; height: 100%; transform: rotate(135deg); overflow: visible; }
  #turbo-medidor .pista { fill: none; stroke: rgba(255,255,255,0.13); stroke-width: 12; stroke-linecap: round; }
  #turbo-medidor .valor { fill: none; stroke: url(#grad-turbo); stroke-width: 12; stroke-linecap: round; transition: stroke-dashoffset 0.08s linear;
    filter: drop-shadow(0 0 6px rgba(255,170,40,0.7)); }
  #turbo-medidor .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column;
    font-weight: 900; font-style: italic; }
  #turbo-num { font-size: 46px; line-height: 1; font-variant-numeric: tabular-nums; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
  #turbo-medidor .lbl { font-size: 11px; letter-spacing: 3px; opacity: 0.75; font-style: normal; }
  #turbo-medidor.usando #turbo-num { color: #ffd36b; }
  #velocimetro { position: absolute; right: 190px; bottom: 34px; font-weight: 900; font-style: italic; text-align: right; opacity: 0.85; }
  #velocimetro .v { font-size: 26px; font-variant-numeric: tabular-nums; } #velocimetro .u { font-size: 11px; letter-spacing: 2px; opacity: 0.7; font-style: normal; }
  #velocimetro.ss .v { color: #9fe6ff; text-shadow: 0 0 12px rgba(120,220,255,0.9); }
  .etiqueta { position: absolute; transform: translate(-50%, -100%); font-size: 13px; font-weight: 800; padding: 2px 8px; border-radius: 4px;
    background: rgba(6,10,22,0.62); white-space: nowrap; letter-spacing: 0.5px; }
  .etiqueta.t0 { color: #9fcbff; border-bottom: 2px solid var(--azul); } .etiqueta.t1 { color: #ffc98f; border-bottom: 2px solid var(--naranja); }
  .etiqueta .b { display: block; height: 3px; margin-top: 2px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; }
  .etiqueta .b i { display: block; height: 100%; background: #ffb52e; }
  #flecha-pelota { position: absolute; width: 0; height: 0; opacity: 0; transition: opacity 0.15s; }
  #flecha-pelota.visible { opacity: 1; }
  #flecha-pelota .f { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; }
  #repeticion-banner { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; opacity: 0; transition: opacity 0.25s; }
  #repeticion-banner.visible { opacity: 1; }
  #repeticion-banner .r { display: inline-block; background: rgba(6,10,22,0.85); padding: 10px 22px; border-radius: 30px; font-weight: 900;
    font-style: italic; letter-spacing: 3px; border: 2px solid rgba(255,255,255,0.18); }
  #repeticion-banner .r b { color: #ff4d5e; margin-right: 10px; animation: parpadeo 1s infinite; }
  #repeticion-banner .s { display: block; margin-top: 8px; font-size: 13px; opacity: 0.8; letter-spacing: 1px; }
  @keyframes parpadeo { 50% { opacity: 0.2; } }
  .panel-tabla { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); border: 1px solid var(--borde);
    border-radius: 14px; padding: 18px 22px; min-width: 560px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  table.stats { border-collapse: collapse; width: 100%; font-size: 15px; }
  table.stats th { font-size: 11px; letter-spacing: 2px; opacity: 0.65; font-weight: 800; padding: 6px 10px; text-align: right; }
  table.stats th:first-child, table.stats td:first-child { text-align: left; }
  table.stats td { padding: 7px 10px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; border-top: 1px solid rgba(255,255,255,0.07); }
  table.stats tr.t0 td:first-child { border-left: 4px solid var(--azul); } table.stats tr.t1 td:first-child { border-left: 4px solid var(--naranja); }
  table.stats tr.yo td { background: rgba(255,255,255,0.06); }
  table.stats .mvp { color: var(--acento); font-size: 11px; margin-left: 6px; letter-spacing: 1px; }



  /* ---------------- Botones ---------------- */
  .boton { pointer-events: auto; cursor: pointer; border: 1px solid rgba(160,190,255,0.35); background: rgba(20,30,60,0.8); color: var(--tinta);
    font: 800 16px/1 "Segoe UI", Arial, sans-serif; letter-spacing: 1px; padding: 13px 22px; border-radius: 10px; font-style: italic;
    transition: transform 0.12s, background 0.12s, border-color 0.12s, box-shadow 0.12s; }
  .boton:hover, .boton:focus-visible { transform: translateY(-2px) scale(1.02); background: rgba(40,70,140,0.9); border-color: #9fc2ff; outline: none;
    box-shadow: 0 8px 24px rgba(40,110,255,0.35); }
  .boton.primario { background: linear-gradient(90deg, #1f6fff, #6a4dff 55%, #ff7a12); border-color: transparent; }
  .boton.primario:hover, .boton.primario:focus-visible { box-shadow: 0 10px 30px rgba(255,140,60,0.35); }

  /* ---------------- Pantalla final ---------------- */
  #fin { position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: rgba(3,6,14,0.55);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  #fin .caja { background: var(--panel); border: 1px solid var(--borde); border-radius: 18px; padding: 26px 30px; min-width: 620px; max-width: 92vw;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
  #fin .res { text-align: center; font-weight: 900; font-style: italic; font-size: 54px; letter-spacing: 2px; margin: 0; }
  #fin .res.gana { color: #ffe27a; } #fin .res.pierde { color: #ff8b8b; }
  #fin .final-marcador { text-align: center; font-size: 26px; font-weight: 900; font-style: italic; margin: 4px 0 14px; }
  #fin .final-marcador .a { color: #8fc2ff; } #fin .final-marcador .n { color: #ffc27a; }
  #fin .mvp-caja { text-align: center; margin: 0 0 16px; font-size: 16px; }
  #fin .mvp-caja b { color: var(--acento); font-size: 20px; }
  #fin .botones { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }

  /* Resultados de pruebas (?test) */
  #pruebas { position: fixed; inset: 0; z-index: 60; overflow: auto; padding: 28px 32px; background: #070b16;
    font: 14px/1.5 ui-monospace, Menlo, Consolas, monospace; }
  #pruebas h1 { font-family: "Segoe UI", Arial, sans-serif; margin: 0 0 6px; font-size: 26px; }
  #pruebas .res { margin: 6px 0; padding: 8px 12px; border-radius: 6px; background: rgba(255,255,255,0.04); }
  #pruebas .pasa { color: #6dff9a; }
  #pruebas .falla { color: #ff6b6b; }
  #pruebas .corre { color: #ffd24a; }
  #pruebas .det { color: #9fb3d9; font-size: 12px; white-space: pre-wrap; }
  #pruebas .resumen { margin-top: 16px; font-size: 18px; font-weight: 700; }
</style>

<script>
/* Arranque: manejo global de errores. Se ejecuta antes que el módulo para garantizar
   que cualquier fallo (incluida la carga de Three.js) se muestre en pantalla. */
(function () {
  function mostrar(titulo, mensaje, pila) {
    var p = document.getElementById('tf-error');
    if (!p) {
      p = document.createElement('div');
      p.id = 'tf-error';
      (document.body || document.documentElement).appendChild(p);
    }
    p.innerHTML = '';
    var h = document.createElement('h1'); h.textContent = titulo || 'Error';
    var m = document.createElement('div'); m.className = 'msg'; m.textContent = mensaje || '(sin mensaje)';
    var s = document.createElement('pre'); s.textContent = pila || '(sin stack disponible)';
    var b = document.createElement('button'); b.textContent = 'Recargar';
    b.onclick = function () { location.reload(); };
    p.appendChild(h); p.appendChild(m); p.appendChild(s); p.appendChild(b);
    p.style.display = 'block';
    var c = document.getElementById('carga'); if (c) c.style.display = 'none';
    try { console.error('[Turbo Fútbol] ' + titulo + ': ' + mensaje + '\n' + (pila || '')); } catch (e) {}
  }
  window.__tfMostrarError = mostrar;
  window.__tfArrancado = false;
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target !== window && (e.target.src || e.target.href)) {
      mostrar('No se pudo cargar un recurso', String(e.target.src || e.target.href), '');
      return;
    }
    var err = e && e.error;
    mostrar('Error inesperado', (err && err.message) || (e && e.message) || 'Error desconocido',
      (err && err.stack) || ((e && e.filename) ? (e.filename + ':' + e.lineno + ':' + e.colno) : ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    mostrar('Error inesperado (promesa)', (r && r.message) || String(r), (r && r.stack) || '');
  });
  setTimeout(function () {
    if (!window.__tfArrancado && !/[?&]test/.test(location.search)) {
      mostrar('El juego no terminó de cargar',
        'La inicialización tardó demasiado. Se necesita acceso a cdn.jsdelivr.net para descargar Three.js ' +
        'y un navegador con soporte de módulos ES, import maps y WebGL2 (Chrome o Safari recientes).', '');
    }
  }, 25000);
})();
</script>

<body>
<div id="juego"></div>
<div id="carga"><div class="titulo">TURBO FÚTBOL</div><div class="sub">Cargando…</div></div>
<div id="hud" class="oculto">
  <div id="marcador">
    <div class="equipo azul"><span class="nombre">AZUL</span><span class="goles" id="goles-azul">0</span></div>
    <div class="reloj"><span id="reloj">5:00</span><span id="reloj-sub"></span></div>

  <div id="flecha-pelota"><svg class="f" viewBox="0 0 44 44"><circle cx="22" cy="22" r="17" fill="rgba(6,10,22,0.75)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/><path d="M14 16 L32 22 L14 28 L18 22 Z" fill="#fff"/></svg></div>

  <div id="feed"></div>

  <div id="turbo-medidor">
    <svg viewBox="0 0 150 150"><defs><linearGradient id="grad-turbo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ff7a1a"/></linearGradient></defs>
      <circle class="pista" cx="75" cy="75" r="62" stroke-dasharray="292.2 389.6"/>
      <circle class="valor" id="turbo-arco" cx="75" cy="75" r="62" stroke-dasharray="292.2 389.6" stroke-dashoffset="292.2"/></svg>

</div>

</div></div>

<script type="module">
'use strict';
/* =====================================================================
   TURBO FÚTBOL — juego 3D de fútbol con autos
   Física propia determinista a 120 Hz (Z vertical, unidades uu = cm).
   El render (Three.js, Y vertical, 1 unidad = 100 uu) convierte con un único helper.
   ===================================================================== */

// =====================================================================
// CONFIG — todos los valores afinables del juego
// =====================================================================
const CONFIG = {
  physics: {
    tickRate: 120,          // Hz, paso fijo
    gravity: 650,           // uu/s²
    maxTicksPerFrame: 15,   // evita espiral de la muerte
  },
  render: {
    uuPerUnit: 100,         // 1 unidad Three.js = 100 uu
  },
  arena: {
    halfWidth: 4096,        // paredes laterales x = ±4096
    halfLength: 5120,       // paredes de fondo y = ±5120
    height: 2044,           // techo
    cornerSum: 8064,        // chaflanes: |x| + |y| = 8064
    filletRadius: 450,      // radio de las curvas piso/pared/techo (≥ 2300/5.5 para seguirlas a tope de velocidad)
    goalHalfWidth: 892.755, // portería: ancho 1786
    goalHeight: 642.775,
    goalDepth: 880,
    goalZoneExt: 1000,      // extensión de la zona especial de la SDF frente a la portería
  },
  input: {
    deadzone: 0.15,         // zona muerta del stick (configurable en Ajustes)
  },
  camera: {
    fov: 110,               // FOV horizontal en grados
    distance: 270,          // uu detrás del auto
    height: 100,            // uu sobre el auto
    angle: -4,              // grados (negativo = mira hacia abajo)
    stiffness: 0.45,        // 0 = suave, 1 = rígida
    transition: 1.2,        // velocidad de transición de la cámara de pelota
    ballCam: true,
    shake: true,
  },
  audio: {
    master: 0.8, sfx: 0.9, engine: 0.55, crowd: 0.6,
  },
  car: {
    mass: 180,
    hitboxHalf: [59.0, 42.1, 18.1],       // OBB 118 x 84.2 x 36.2
    hitboxOffset: [13.88, 0, 20.75],      // centro de la caja respecto al centro de masa (local)
    restZ: 17,                            // altura del centro de masa en reposo
    maxSpeed: 2300,
    maxAngSpeed: 5.5,
    supersonicSpeed: 2200,
    supersonicMaintainSpeed: 2100,
    supersonicMaintainTime: 1.0,
    throttleCurve: [[0, 1600], [1400, 160], [1410, 0]],
    brakeAccel: 3500,
    coastAccel: 525,
    stoppingSpeed: 25,
    throttleDeadzone: 0.01,
    airThrottleAccel: 66.667,
    steerCurvature: [[0, 0.0069], [500, 0.00398], [1000, 0.00235], [1500, 0.001375], [1750, 0.0011], [2300, 0.00088]],
    powerslideCurvature: [[0, 0.0069], [500, 0.00415], [1500, 0.00279], [2500, 0.00149]],
    yawResponse: 28,                      // 1/s: qué tan rápido la rotación sigue a la dirección
    latAccelMax: 6500,                    // agarre lateral máximo (uu/s²)
    latSlipCurve: [[0, 1.0], [1, 0.2]],   // agarre según deslizamiento lateral
    powerslideLatFactor: 0.1,             // agarre lateral durante el derrape
    powerslideRise: 5,
    powerslideFall: 2,
    stickyBase: 0.5,                      // fuerza de pegado = g·(base + extra·(1 − n.z))
    stickyWallExtra: 1.0,
    wallMinSpeed: 350,                    // bajo esta velocidad en pared/techo se despega
    wallSteepNz: 0.7,                     // n.z bajo el cual se considera pared
    alignStiffness: 45,                   // alineación al caer sobre 1-3 ruedas (rad/s² por rad)
    alignDamping: 7,
    wheels: [
      { x: 51.25, y: 25.9, r: 12.5, front: true },
      { x: 51.25, y: -25.9, r: 12.5, front: true },
      { x: -33.75, y: 29.5, r: 15, front: false },
      { x: -33.75, y: -29.5, r: 15, front: false },
    ],
    suspension: {
      mountZ: 10,             // altura local del anclaje del resorte

// =====================================================================
// UTILIDADES MATEMÁTICAS
// =====================================================================
const TICK_RATE = CONFIG.physics.tickRate;
const DT = 1 / TICK_RATE;
const INV_SQRT2 = Math.SQRT1_2;
const TAU = Math.PI * 2;

function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function sign(v) { return v < 0 ? -1 : 1; }
function smoothstep(a, b, x) { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function wrapAngle(a) { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; }
/** Curva lineal por tramos: points = [[x0, y0], [x1, y1], ...] (x crecientes). */
function curve(points, x) {
  if (x <= points[0][0]) return points[0][1];
  for (let i = 1; i < points.length; i++) {
    const p1 = points[i];
    if (x <= p1[0]) {
      const p0 = points[i - 1];
      return p0[1] + (p1[1] - p0[1]) * (x - p0[0]) / (p1[0] - p0[0]);
    }
  }
  return points[points.length - 1][1];
}

class V3 {
  constructor(x = 0, y = 0, z = 0) { this.x = x; this.y = y; this.z = z; }
  set(x, y, z) { this.x = x; this.y = y; this.z = z; return this; }
  copy(v) { this.x = v.x; this.y = v.y; this.z = v.z; return this; }
  clone() { return new V3(this.x, this.y, this.z); }
  add(v) { this.x += v.x; this.y += v.y; this.z += v.z; return this; }
  sub(v) { this.x -= v.x; this.y -= v.y; this.z -= v.z; return this; }
  addScaled(v, s) { this.x += v.x * s; this.y += v.y * s; this.z += v.z * s; return this; }
  scale(s) { this.x *= s; this.y *= s; this.z *= s; return this; }
  addVectors(a, b) { this.x = a.x + b.x; this.y = a.y + b.y; this.z = a.z + b.z; return this; }
  subVectors(a, b) { this.x = a.x - b.x; this.y = a.y - b.y; this.z = a.z - b.z; return this; }
  lerpVectors(a, b, t) { this.x = a.x + (b.x - a.x) * t; this.y = a.y + (b.y - a.y) * t; this.z = a.z + (b.z - a.z) * t; return this; }
  dot(v) { return this.x * v.x + this.y * v.y + this.z * v.z; }
  crossVectors(a, b) {
    const x = a.y * b.z - a.z * b.y, y = a.z * b.x - a.x * b.z, z = a.x * b.y - a.y * b.x;
    this.x = x; this.y = y; this.z = z; return this;
  }
  length() { return Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z); }
  lengthSq() { return this.x * this.x + this.y * this.y + this.z * this.z; }
  normalize() {
    const l = Math.sqrt(this.x * this.x + this.y * this.y + this.z * this.z);
    if (l > 1e-12) { this.x /= l; this.y /= l; this.z /= l; }
    return this;
  }
  distanceTo(v) { const dx = this.x - v.x, dy = this.y - v.y, dz = this.z - v.z; return Math.sqrt(dx * dx + dy * dy + dz * dz); }
  clampLength(max) {
    const l2 = this.lengthSq();
    if (l2 > max * max) { const s = max / Math.sqrt(l2); this.x *= s; this.y *= s; this.z *= s; }
    return this;
  }
  isFinite() { return Number.isFinite(this.x) && Number.isFinite(this.y) && Number.isFinite(this.z); }
}

const Z_UP = new V3(0, 0, 1);

/** Rota v alrededor del eje unitario (kx,ky,kz) un ángulo con coseno c y seno s (Rodrigues). */
function rotateAxis(v, kx, ky, kz, c, s) {
  const dot = kx * v.x + ky * v.y + kz * v.z;
  const cx = ky * v.z - kz * v.y, cy = kz * v.x - kx * v.z, cz = kx * v.y - ky * v.x;
  const t = dot * (1 - c);
  const x = v.x * c + cx * s + kx * t;
  const y = v.y * c + cy * s + ky * t;
  const z = v.z * c + cz * s + kz * t;
  v.x = x; v.y = y; v.z = z;
}

/** Orientación como base ortonormal: f (adelante), l (izquierda), u (arriba); f × l = u. */
class Basis {
  constructor() { this.f = new V3(1, 0, 0); this.l = new V3(0, 1, 0); this.u = new V3(0, 0, 1); }
  copy(b) { this.f.copy(b.f); this.l.copy(b.l); this.u.copy(b.u); return this; }
  setYaw(yaw) {
    const c = Math.cos(yaw), s = Math.sin(yaw);
    this.f.set(c, s, 0); this.l.set(-s, c, 0); this.u.set(0, 0, 1); return this;
  }
  /** Construye la base a partir de un vector adelante y un vector arriba aproximado. */
  setFromForwardUp(fwd, up) {
    this.f.copy(fwd).normalize();
    this.u.copy(up).addScaled(this.f, -this.u.copy(up).dot(this.f)).normalize();
    this.l.crossVectors(this.u, this.f);
    return this;
  }
  /** Integra una velocidad angular (mundo) durante dt. */
  rotate(w, dt) {
    const wl = w.length();
    if (wl < 1e-9) return this;
    const ang = wl * dt, kx = w.x / wl, ky = w.y / wl, kz = w.z / wl;
    const c = Math.cos(ang), s = Math.sin(ang);
    rotateAxis(this.f, kx, ky, kz, c, s);
    rotateAxis(this.u, kx, ky, kz, c, s);
    this.orthonormalize();
    return this;
  }
  orthonormalize() {
    this.f.normalize();
    const d = this.u.dot(this.f);
    this.u.addScaled(this.f, -d).normalize();
    this.l.crossVectors(this.u, this.f);
    return this;
  }
  /** Coordenadas locales (f, l, u) de un vector del mundo. */
  toLocal(v, out) { const x = v.dot(this.f), y = v.dot(this.l), z = v.dot(this.u); return out.set(x, y, z); }
  /** Vector del mundo a partir de coordenadas locales. */
  toWorld(lx, ly, lz, out) {
    return out.set(this.f.x * lx + this.l.x * ly + this.u.x * lz,
                   this.f.y * lx + this.l.y * ly + this.u.y * lz,
                   this.f.z * lx + this.l.z * ly + this.u.z * lz);
  }
}

/** Generador pseudoaleatorio determinista (mulberry32). */
class Rng {
  constructor(seed = 1) { this.s = seed >>> 0; }
  next() {
    let t = (this.s += 0x6D2B79F5) >>> 0;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
  int(n) { return Math.floor(this.next() * n); }
}

// =====================================================================
// CANCHA — función de distancia con signo (SDF) exacta
//
// Espacio libre F = P ∪ C⁺ ∪ C⁻
//   P  = prisma octogonal Q (paredes, chaflanes, piso, techo) dilatado por r:
//        bordes redondeados de radio r entre piso/paredes/techo y en las esquinas verticales.
//   C± = cajas de las porterías (extendidas hacia la cancha para cortar la curva del piso).
// D(p) = distancia exacta al borde del espacio libre (positiva dentro), con la normal
// apuntando hacia el espacio libre. Para la portería se usa la distancia a los parches reales
// (paredes, techo, fondo, piso y tapas de la curva) y se ignora el hueco de la boca en P.
// =====================================================================
const AR = { r: 0, H: 0, Xq: 0, Yq: 0, Cq: 0, Y1: 0, X1: 0, Zlo: 0, Zhi: 0, W: 0, Hg: 0, YB: 0, YG: 0, E: 0, bex: 0, bey: 0, bel2: 0 };
function rebuildArena() {
  const A = CONFIG.arena;
  AR.r = A.filletRadius;
  AR.H = A.height;
  AR.Xq = A.halfWidth - AR.r;
  AR.Yq = A.halfLength - AR.r;
  AR.Cq = A.cornerSum - AR.r * Math.SQRT2;
  AR.Y1 = AR.Cq - AR.Xq;          // y donde la pared lateral (de Q) toca el chaflán
  AR.X1 = AR.Cq - AR.Yq;          // x donde la pared de fondo (de Q) toca el chaflán
  AR.Zlo = AR.r;
  AR.Zhi = A.height - AR.r;
  AR.W = A.goalHalfWidth;
  AR.Hg = A.goalHeight;
  AR.YB = A.halfLength;
  AR.YG = A.halfLength + A.goalDepth;
  AR.E = A.goalZoneExt;
  AR.bex = AR.X1 - AR.Xq;
  AR.bey = AR.Yq - AR.Y1;
  AR.bel2 = AR.bex * AR.bex + AR.bey * AR.bey;
}
rebuildArena();

// Gradiente 2D (hacia afuera) del último octSDF, en coordenadas plegadas (|x|, |y|)
let _g2x = 0, _g2y = 0;
/** SDF 2D exacta del octógono de Q para un punto del primer cuadrante. */
function octSDF(ax, ay) {
  const Xq = AR.Xq, Yq = AR.Yq, Cq = AR.Cq;
  if (ax <= Xq && ay <= Yq && ax + ay <= Cq) {
    const dX = Xq - ax, dY = Yq - ay, dC = (Cq - ax - ay) * INV_SQRT2;
    if (dX <= dY && dX <= dC) { _g2x = 1; _g2y = 0; return -dX; }
    if (dY <= dC) { _g2x = 0; _g2y = 1; return -dY; }
    _g2x = INV_SQRT2; _g2y = INV_SQRT2; return -dC;
  }
  // Exterior: el punto más cercano está en uno de los 3 segmentos del primer cuadrante
  let cx = Xq, cy = ay < 0 ? 0 : (ay > AR.Y1 ? AR.Y1 : ay);
  let best = (ax - cx) * (ax - cx) + (ay - cy) * (ay - cy), seg = 0;
  let tx = ax < 0 ? 0 : (ax > AR.X1 ? AR.X1 : ax), ty = Yq;
  let d = (ax - tx) * (ax - tx) + (ay - ty) * (ay - ty);
  if (d < best) { best = d; cx = tx; cy = ty; seg = 1; }
  let t = ((ax - Xq) * AR.bex + (ay - AR.Y1) * AR.bey) / AR.bel2;
  t = t < 0 ? 0 : (t > 1 ? 1 : t);
  tx = Xq + AR.bex * t; ty = AR.Y1 + AR.bey * t;
  d = (ax - tx) * (ax - tx) + (ay - ty) * (ay - ty);
  if (d < best) { best = d; cx = tx; cy = ty; seg = 2; }
  const dist = Math.sqrt(best);
  if (dist > 1e-9) { _g2x = (ax - cx) / dist; _g2y = (ay - cy) / dist; }
  else if (seg === 0) { _g2x = 1; _g2y = 0; }
  else if (seg === 1) { _g2x = 0; _g2y = 1; }
  else { _g2x = INV_SQRT2; _g2y = INV_SQRT2; }
  return dist;
}

/** D_P: distancia al borde de P (positiva dentro). n = normal hacia dentro de P. */
function dPrism(px, py, pz, n) {
  const sx = px < 0 ? -1 : 1, sy = py < 0 ? -1 : 1;
  const d2 = octSDF(px * sx, py * sy);
  const gx = _g2x * sx, gy = _g2y * sy;
  const dzLo = AR.Zlo - pz, dzHi = pz - AR.Zhi;
  let dz, gz;
  if (dzLo > dzHi) { dz = dzLo; gz = -1; } else { dz = dzHi; gz = 1; }
  let s;
  if (d2 > 0 && dz > 0) {
    s = Math.sqrt(d2 * d2 + dz * dz);
    n.x = -gx * d2 / s; n.y = -gy * d2 / s; n.z = -gz * dz / s;
  } else if (d2 > dz) {
    s = d2; n.x = -gx; n.y = -gy; n.z = 0;
  } else {
    s = dz; n.x = 0; n.y = 0; n.z = -gz;
  }
  return AR.r - s;
}

// Punto más cercano del último sidePatch2D
let _spy = 0, _spz = 0;
/** Distancia 2D (en el plano y-z de la pared lateral de la portería) a rect ∪ tapa de la curva. */
function sidePatch2D(sy, sz) {
  const YB = AR.YB, YG = AR.YG, Hg = AR.Hg, r = AR.r;
  // Rectángulo de la pared interior de la portería
  let ny = sy < YB ? YB : (sy > YG ? YG : sy);
  let nz = sz < 0 ? 0 : (sz > Hg ? Hg : sz);
  let best = (sy - ny) * (sy - ny) + (sz - nz) * (sz - nz);
  _spy = ny; _spz = nz;
  if (best === 0) return 0;
  // Tapa R: esquina [YB - r, YB] × [0, r] fuera del círculo de la curva (centro (YB - r, r))
  const ccy = YB - r, ccz = r;
  const ry = sy - ccy, rz = sz - ccz, rl2 = ry * ry + rz * rz;
  if (sy >= ccy && sy <= YB && sz >= 0 && sz <= r && rl2 >= r * r) { _spy = sy; _spz = sz; return 0; }
  // Borde inferior de la tapa (sobre el piso)
  ny = sy < ccy ? ccy : (sy > YB ? YB : sy);
  let d = (sy - ny) * (sy - ny) + sz * sz;
  if (d < best) { best = d; _spy = ny; _spz = 0; }
  // Arco de la curva (solo el cuarto que mira a la esquina)
  if (rl2 < r * r && ry >= 0 && rz <= 0) {
    const rl = Math.sqrt(rl2);
    const da = r - rl;
    if (da * da < best) {
      best = da * da;
      if (rl > 1e-9) { _spy = ccy + ry / rl * r; _spz = ccz + rz / rl * r; }
      else { _spy = ccy + r * INV_SQRT2; _spz = ccz - r * INV_SQRT2; }
    }
  }
  return Math.sqrt(best);
}

/**
 * SDF exacta de la cancha. Devuelve la distancia con signo (positiva en espacio libre)
 * y escribe en n la normal unitaria que apunta hacia el espacio libre.
 */
function arenaSDF(px, py, pz, n) {
  const dp = dPrism(px, py, pz, n);
  const ay = py < 0 ? -py : py;
  if (ay < AR.YB - AR.E) return dp;
  const W = AR.W, Hg = AR.Hg, YB = AR.YB, YG = AR.YG, E = AR.E;
  const sgn = py < 0 ? -1 : 1, sxp = px < 0 ? -1 : 1;
  const gx = px * sxp, gy = ay, gz = pz;
  // ¿El punto más cercano de P cae en el hueco (boca) de la portería?
  const qx = px - dp * n.x, qy = (py - dp * n.y) * sgn, qz = pz - dp * n.z;
  const inHole = qx < W && qx > -W && qz > 1e-3 && qz < Hg && qy > YB - E;
  let best = inHole ? Infinity : (dp < 0 ? -dp : dp);
  let kind = 0, cx = 0, cy = 0, cz = 0, fnx = 0, fny = 0, fnz = 0;
  let nx, ny, d;
  // Piso de la portería (extendido hacia la cancha)
  nx = gx < W ? gx : W;
  ny = gy < YB - E ? YB - E : (gy > YG ? YG : gy);
  d = Math.sqrt((gx - nx) * (gx - nx) + (gy - ny) * (gy - ny) + gz * gz);
  if (d < best) { best = d; kind = 1; cx = nx; cy = ny; cz = 0; fnx = 0; fny = 0; fnz = 1; }
  // Techo de la portería (travesaño hacia adentro)
  ny = gy < YB ? YB : (gy > YG ? YG : gy);
  d = Math.sqrt((gx - nx) * (gx - nx) + (gy - ny) * (gy - ny) + (gz - Hg) * (gz - Hg));
  if (d < best) { best = d; kind = 1; cx = nx; cy = ny; cz = Hg; fnx = 0; fny = 0; fnz = -1; }
  // Fondo de la portería
  const nz = gz < 0 ? 0 : (gz > Hg ? Hg : gz);
  d = Math.sqrt((gx - nx) * (gx - nx) + (gy - YG) * (gy - YG) + (gz - nz) * (gz - nz));
  if (d < best) { best = d; kind = 1; cx = nx; cy = YG; cz = nz; fnx = 0; fny = -1; fnz = 0; }
  // Pared lateral de la portería (+ tapa de la curva del piso junto al poste)
  const d2 = sidePatch2D(gy, gz);
  d = Math.sqrt((gx - W) * (gx - W) + d2 * d2);
  if (d < best) { best = d; kind = 1; cx = W; cy = _spy; cz = _spz; fnx = -1; fny = 0; fnz = 0; }

  if (kind === 0) return dp; // la pared de P es la más cercana: n ya está calculada
  const inside = dp > 0 || (gx < W && gz > 0 && gz < Hg && gy > YB - E && gy < YG);
  const vx = px - cx * sxp, vy = py - cy * sgn, vz = pz - cz;
  if (best > 1e-7) {
    const s = (inside ? 1 : -1) / best;
    n.x = vx * s; n.y = vy * s; n.z = vz * s;
  } else {
    n.x = fnx * sxp; n.y = fny * sgn; n.z = fnz;
  }
  return inside ? best : -best;
}

const _rayN = new V3();
/**
 * Raycast contra la cancha por sphere tracing sobre la SDF exacta.
 * hit = { t, x, y, z, nx, ny, nz }. Devuelve true si golpea antes de maxT.
 */
function arenaRaycast(ox, oy, oz, dx, dy, dz, maxT, hit, eps = 0.05) {
  let t = 0;
  for (let i = 0; i < 48; i++) {
    const x = ox + dx * t, y = oy + dy * t, z = oz + dz * t;
    const d = arenaSDF(x, y, z, _rayN);
    if (d < eps) {
      hit.t = t; hit.x = x; hit.y = y; hit.z = z;
      hit.nx = _rayN.x; hit.ny = _rayN.y; hit.nz = _rayN.z;
      return true;
    }
    t += d;
    if (t > maxT) return false;
  }
  return false;
}

// =====================================================================
// AUTO — física propia: suspensión por raycasts, agarre, derrape, pegado a superficies,
// saltos (doble salto, dodge, flip cancel), control aéreo y turbo.
// =====================================================================
class Controls {
  constructor() { this.reset(); }
  reset() {
    this.throttle = 0; this.steer = 0; this.pitch = 0; this.yaw = 0; this.roll = 0;
    this.jump = false; this.boost = false; this.handbrake = false;
    return this;
  }
  copy(c) {
    this.throttle = c.throttle; this.steer = c.steer; this.pitch = c.pitch; this.yaw = c.yaw; this.roll = c.roll;
    this.jump = c.jump; this.boost = c.boost; this.handbrake = c.handbrake;
    return this;
  }
  sanitize() {
    const f = (v) => (Number.isFinite(v) ? clamp(v, -1, 1) : 0);
    this.throttle = f(this.throttle); this.steer = f(this.steer); this.pitch = f(this.pitch);
    this.yaw = f(this.yaw); this.roll = f(this.roll);
    this.jump = !!this.jump; this.boost = !!this.boost; this.handbrake = !!this.handbrake;
    return this;
  }
}

const _hit = { t: 0, x: 0, y: 0, z: 0, nx: 0, ny: 0, nz: 1 };
const _ca = new V3(), _cb = new V3(), _cc = new V3(), _cd = new V3(), _ce = new V3(), _cf = new V3();
const _acc = new V3(), _ang = new V3(), _cn = new V3(), _ia = new V3(), _ib = new V3();

/** Muestras sobre la superficie de la caja (en múltiplos de los semiejes). */
const HITBOX_SAMPLES = (() => {
  const out = [];
  for (const x of [-1, -0.5, 0, 0.5, 1]) for (const y of [-1, 0, 1]) for (const z of [-1, 0, 1]) {
    if (Math.abs(x) === 1 || Math.abs(y) === 1 || Math.abs(z) === 1) out.push([x, y, z]);
  }
  return out;
})();

class Car {
  constructor(id, team, name) {
    const C = CONFIG.car;
    this.id = id; this.team = team; this.name = name;
    this.isBot = false;
    this.pos = new V3(); this.vel = new V3(); this.angVel = new V3(); this.rot = new Basis();
    this.prevPos = new V3(); this.prevRot = new Basis();
    this.groundNormal = new V3(0, 0, 1);
    this.worldContactN = new V3(0, 0, 1);
    this.controls = new Controls();
    const hx = C.hitboxHalf[0] * 2, hy = C.hitboxHalf[1] * 2, hz = C.hitboxHalf[2] * 2;
    this.invI = new V3(12 / (C.mass * (hy * hy + hz * hz)), 12 / (C.mass * (hx * hx + hz * hz)), 12 / (C.mass * (hx * hx + hy * hy)));
    this.wheels = C.wheels.map((w) => {
      const S = C.suspension;
      const Lrest = S.mountZ + C.restZ - w.r;
      const L0 = Lrest + S.netAccel / S.stiffness;
      return { x: w.x, y: w.y, r: w.r, front: w.front, L0, k: 0, c: 0, contact: false, susLen: L0, comp: 0,
        px: 0, py: 0, pz: 0, nx: 0, ny: 0, nz: 1, spin: 0, spinVel: 0 };
    });
    this.setupSuspension();
    this.events = [];
    this.steerVis = 0;
    this.resetState();
  }
  setupSuspension() {
    const S = CONFIG.car.suspension;
    const xf = this.wheels.find((w) => w.front).x, xb = this.wheels.find((w) => !w.front).x;
    const wb = xf - xb;
    const K = S.stiffness;
    const Ct = 2 * S.dampingRatio * Math.sqrt(K);
    for (const w of this.wheels) {
      const share = (w.front ? -xb : xf) / wb / 2;
      w.k = K * share; w.c = Ct * share;
    }
  }
  resetState() {
    this.vel.set(0, 0, 0); this.angVel.set(0, 0, 0);
    this.boost = CONFIG.boost.kickoffAmount; this.boosting = false; this.boostTime = 0;
    this.unlimitedBoost = this.unlimitedBoost || false;
    this.onGround = false; this.numContacts = 0; this.groundNormal.set(0, 0, 1);
    this.handbrakeAmt = 0;
    this.jumpHeld = false; this.isJumping = false; this.jumpTime = 0;
    this.hasJumped = false; this.hasDoubleJumped = false; this.hasFlipped = false;
    this.isFlipping = false; this.flipTime = 0; this.flipPitch = 0; this.flipRoll = 0;
    this.airTime = 0; this.airTimeSinceJump = 0; this.timeSinceJumpStart = 10;
    this.autoFlipTimer = 0; this.autoFlipDir = 1;
    this.supersonic = false; this.supersonicTime = 0;
    this.worldContactTimer = 0; this.worldContactN.set(0, 0, 1);
    this.demolished = false; this.respawnTimer = 0;
    this.lastBallTouchTick = -1000;
    this.bumpCooldown = 0;
    this.landingSpeed = 0;
    const S = CONFIG.car.suspension;
    for (const w of this.wheels) { w.contact = false; w.susLen = w.L0 - S.netAccel / S.stiffness; w.comp = 0; }
  }
  /** Coloca el auto en reposo sobre el piso mirando hacia yaw (radianes, 0 = +x). */
  placeAt(x, y, yaw) {
    this.resetState();
    this.pos.set(x, y, CONFIG.car.restZ);
    this.rot.setYaw(yaw);
    this.prevPos.copy(this.pos); this.prevRot.copy(this.rot);
  }
  /** Velocidad de un punto con posición relativa r (desde el centro de masa). */
  pointVelRel(rx, ry, rz, out) {
    const w = this.angVel;
    return out.set(this.vel.x + w.y * rz - w.z * ry, this.vel.y + w.z * rx - w.x * rz, this.vel.z + w.x * ry - w.y * rx);
  }
  /** Tensor de inercia inverso en el mundo aplicado a v. */
  invInertia(v, out) {
    const b = this.rot;
    const lx = v.dot(b.f) * this.invI.x, ly = v.dot(b.l) * this.invI.y, lz = v.dot(b.u) * this.invI.z;
    return b.toWorld(lx, ly, lz, out);
  }
  /** Masa inversa efectiva en r (relativo) a lo largo de la dirección unitaria n. */
  invMassAt(rx, ry, rz, n) {
    _ia.set(ry * n.z - rz * n.y, rz * n.x - rx * n.z, rx * n.y - ry * n.x);
    this.invInertia(_ia, _ib);
    const cx = _ib.y * rz - _ib.z * ry, cy = _ib.z * rx - _ib.x * rz, cz = _ib.x * ry - _ib.y * rx;
    return 1 / CONFIG.car.mass + cx * n.x + cy * n.y + cz * n.z;
  }
  /** Aplica el impulso (jx,jy,jz) [masa·uu/s] en el punto relativo r. */
  applyImpulse(rx, ry, rz, jx, jy, jz) {
    const im = 1 / CONFIG.car.mass;
    this.vel.x += jx * im; this.vel.y += jy * im; this.vel.z += jz * im;
    _ia.set(ry * jz - rz * jy, rz * jx - rx * jz, rx * jy - ry * jx);
    this.invInertia(_ia, _ib);
    this.angVel.add(_ib);
  }
  /** Centro de la caja de colisión (mundo). */
  hitboxCenter(out) {
    const O = CONFIG.car.hitboxOffset;
    return this.rot.toWorld(O[0], O[1], O[2], out).add(this.pos);
  }
  /** Raycasts de suspensión (uno por rueda) contra la cancha. */
  updateWheels() {
    const b = this.rot, f = b.f, l = b.l, u = b.u, mz = CONFIG.car.suspension.mountZ;
    let nc = 0;
    this.groundNormal.set(0, 0, 0);
    for (const w of this.wheels) {
      const mx = this.pos.x + f.x * w.x + l.x * w.y + u.x * mz;
      const my = this.pos.y + f.y * w.x + l.y * w.y + u.y * mz;
      const mzz = this.pos.z + f.z * w.x + l.z * w.y + u.z * mz;
      const maxT = w.L0 + w.r;
      if (arenaRaycast(mx, my, mzz, -u.x, -u.y, -u.z, maxT + 1, _hit) && _hit.t <= maxT) {
        w.contact = true;
        w.susLen = Math.max(0, _hit.t - w.r);
        w.comp = w.L0 - w.susLen;
        w.px = _hit.x; w.py = _hit.y; w.pz = _hit.z;
        w.nx = _hit.nx; w.ny = _hit.ny; w.nz = _hit.nz;
        this.groundNormal.x += _hit.nx; this.groundNormal.y += _hit.ny; this.groundNormal.z += _hit.nz;
        nc++;
      } else {
        w.contact = false;
        // la rueda cuelga: se extiende suavemente (solo visual)
        w.susLen = Math.min(w.L0, w.susLen + 240 * DT);
        w.comp = 0;
      }
    }
    this.numContacts = nc;
    if (nc > 0) this.groundNormal.normalize(); else this.groundNormal.copy(u);
  }

  step(ctl, dt) {
    const C = CONFIG.car, J = CONFIG.jump, D = CONFIG.dodge, B = CONFIG.boost, g = CONFIG.physics.gravity;
    this.prevPos.copy(this.pos); this.prevRot.copy(this.rot);
    if (this.demolished) return;
    ctl.sanitize();
    const b = this.rot, f = b.f, l = b.l, u = b.u;
    const wasOnGround = this.onGround;
    this.updateWheels();
    const nc = this.numContacts;
    const onGround = nc >= 3;
    this.onGround = onGround;
    const N = this.groundNormal;
    if (onGround && !wasOnGround) {
      this.landingSpeed = -this.vel.dot(N);
      if (this.landingSpeed > 250) this.events.push({ type: 'aterrizaje', speed: this.landingSpeed });
    }

    // Derrape (sube a 5/s, baja a 2/s)
    this.handbrakeAmt = ctl.handbrake ? Math.min(1, this.handbrakeAmt + C.powerslideRise * dt)
      : Math.max(0, this.handbrakeAmt - C.powerslideFall * dt);

    // ---------------- Saltos ----------------
    const jumpPressed = ctl.jump && !this.jumpHeld;
    this.jumpHeld = ctl.jump;
    this.timeSinceJumpStart += dt;
    if (onGround && !this.isJumping && this.timeSinceJumpStart > J.resetPad) {
      // Tocar una superficie con las ruedas recupera los saltos
      this.hasJumped = false; this.hasDoubleJumped = false; this.hasFlipped = false; this.isFlipping = false;
      this.airTime = 0; this.airTimeSinceJump = 0;
    }
    if (!onGround) this.airTime += dt;
    _acc.set(0, 0, -g);
    _ang.set(0, 0, 0);
    if (jumpPressed) {
      const onRoof = nc === 0 && this.worldContactTimer > 0 && this.worldContactN.dot(u) < -0.7;
      if (onGround && !this.isJumping) {
        this.isJumping = true; this.jumpTime = 0; this.hasJumped = true; this.timeSinceJumpStart = 0;
        this.vel.addScaled(u, J.impulse);
        this.events.push({ type: 'salto' });
      } else if (onRoof) {
        // Recuperación automática al quedar sobre el techo del auto
        this.autoFlipTimer = C.autoFlipTime;
        _ca.crossVectors(u, this.worldContactN);
        const s = _ca.dot(f);
        this.autoFlipDir = Math.abs(s) > 0.05 ? Math.sign(s) : 1;
        this.vel.addScaled(this.worldContactN, C.autoFlipImpulse);
        this.events.push({ type: 'salto' });
      } else if (!onGround && !this.isJumping && !this.hasDoubleJumped && !this.hasFlipped &&
                 (this.hasJumped ? this.airTimeSinceJump < J.secondWindow : this.airTime < J.secondWindow)) {
        const dx = -ctl.pitch, dy = clamp(ctl.yaw + ctl.roll, -1, 1);
        if (Math.abs(dx) + Math.abs(dy) >= D.deadzone) {
          this.startDodge(dx, dy);
          this.events.push({ type: 'dodge' });
        } else {
          this.vel.addScaled(u, J.impulse);
          this.hasDoubleJumped = true;
          this.events.push({ type: 'doble' });
        }
      }
    }
    if (this.isJumping) {
      this.jumpTime += dt;
      if (this.jumpTime <= J.maxHold + 1e-9 && (ctl.jump || this.jumpTime <= J.minHold + 1e-9)) _acc.addScaled(u, J.holdAccel);
      else this.isJumping = false;
    }
    if (this.hasJumped && !this.isJumping && !onGround) this.airTimeSinceJump += dt;
    if (this.isFlipping) this.flipTime += dt;

    // ---------------- Fuerzas con contacto ----------------
    if (nc > 0) {
      for (const w of this.wheels) {
        if (!w.contact) continue;
        const rx = w.px - this.pos.x, ry = w.py - this.pos.y, rz = w.pz - this.pos.z;
        this.pointVelRel(rx, ry, rz, _ca);
        const xdot = -(_ca.x * w.nx + _ca.y * w.ny + _ca.z * w.nz);
        let F = w.k * w.comp + w.c * xdot;            // aceleración por unidad de masa
        if (F < 0) F = 0;
        _acc.x += w.nx * F; _acc.y += w.ny * F; _acc.z += w.nz * F;
        _cb.set(ry * w.nz - rz * w.ny, rz * w.nx - rx * w.nz, rx * w.ny - ry * w.nx).scale(F * C.mass);
        this.invInertia(_cb, _cc);
        _ang.add(_cc);
      }
      if (onGround && !this.isJumping) {
        // Pegado a la superficie (más fuerte en paredes y techo); se pierde si va muy lento en pared
        let sticky = C.stickyBase + C.stickyWallExtra * (1 - N.z);
        if (N.z < C.wallSteepNz) sticky *= smoothstep(C.wallMinSpeed * 0.6, C.wallMinSpeed, this.vel.length());
        _acc.addScaled(N, -g * sticky);
      }
      if (nc < 4 && !this.isJumping && this.autoFlipTimer <= 0) {
        // Alineación suave con la superficie al caer sobre algunas ruedas
        _cb.crossVectors(u, N);
        const wn = this.angVel.dot(N);
        _cc.copy(this.angVel).addScaled(N, -wn);
        _ang.addScaled(_cb, C.alignStiffness).addScaled(_cc, -C.alignDamping);
      }
    }

    // ---------------- Rotación: dodge y control aéreo ----------------
    const wf = this.angVel.dot(f), wl = this.angVel.dot(l), wu = this.angVel.dot(u);
    let af = 0, al = 0, au = 0;
    let rollLocked = false, pitchLocked = false;
    if (this.isFlipping) {
      const inLock = this.flipTime < D.lockTime;
      rollLocked = inLock && this.flipRoll !== 0;
      pitchLocked = inLock && this.flipPitch !== 0;
      if (this.flipTime <= D.torqueTime) {
        let pitchScale = 1;
        if (this.flipPitch !== 0 && ctl.pitch !== 0 && Math.sign(ctl.pitch) === Math.sign(this.flipPitch)) {
          // Flip cancel: dirección contraria detiene la rotación
          pitchScale = 1 - Math.min(1, Math.abs(ctl.pitch));
          al -= wl * D.cancelDamping * Math.abs(ctl.pitch);
        }
        af += this.flipRoll * D.flipAccel;
        al += this.flipPitch * D.flipAccel * pitchScale;
      }
    }
    if (nc === 0) {
      const T = CONFIG.air.torque, Dm = CONFIG.air.damping;
      if (!rollLocked) af += ctl.roll * T.roll - wf * Dm.roll;
      if (!pitchLocked) al += -ctl.pitch * T.pitch - wl * Dm.pitch * (1 - Math.abs(ctl.pitch));
      au += -ctl.yaw * T.yaw - wu * Dm.yaw * (1 - Math.abs(ctl.yaw));
      _acc.addScaled(f, ctl.throttle * C.airThrottleAccel);
    }
    if (this.autoFlipTimer > 0) {
      this.autoFlipTimer -= dt;
      const target = this.autoFlipDir * Math.PI / C.autoFlipTime * 1.15;
      af += (target - wf) * 30;
    }
    _ang.addScaled(f, af).addScaled(l, al).addScaled(u, au);

    // ---------------- Turbo ----------------
    if (this.boostTime > 0) this.boostTime -= dt;
    const wantBoost = ctl.boost || (this.boosting && this.boostTime > 0);
    if (wantBoost && (this.boost > 0 || this.unlimitedBoost)) {
      if (!this.boosting) this.boostTime = B.minTime;
      this.boosting = true;
      if (!this.unlimitedBoost) this.boost = Math.max(0, this.boost - B.usePerSecond * dt);
      _acc.addScaled(f, onGround ? B.groundAccel : B.airAccel);
    } else {
      this.boosting = false;
    }

    // ---------------- Integración ----------------
    this.vel.addScaled(_acc, dt);
    this.angVel.addScaled(_ang, dt);
    if (nc > 0) this.driveGround(ctl, dt);
    if (this.isFlipping && this.flipTime <= D.torqueTime && this.flipTime >= D.zDampStart &&
        (this.vel.z < 0 || this.flipTime < D.zDampEnd)) {
      this.vel.z *= Math.pow(1 - D.zDamp120, dt * 120);
    }
    this.vel.clampLength(C.maxSpeed);
    this.angVel.clampLength(C.maxAngSpeed);
    this.pos.addScaled(this.vel, dt);
    this.rot.rotate(this.angVel, dt);

    // Supersónico
    const speed = this.vel.length();
    if (speed >= C.supersonicSpeed) { this.supersonic = true; this.supersonicTime = 0; }
    else if (this.supersonic && speed >= C.supersonicMaintainSpeed && this.supersonicTime < C.supersonicMaintainTime) this.supersonicTime += dt;
    else this.supersonic = false;
    if (this.worldContactTimer > 0) this.worldContactTimer -= dt;
    if (this.bumpCooldown > 0) this.bumpCooldown -= dt;
    this.updateWheelVisuals(ctl, dt);
  }

  /** Dodge: impulso horizontal + rotación rápida; anula la velocidad vertical al empezar. */
  startDodge(dx, dy) {
    const C = CONFIG.car, D = CONFIG.dodge, b = this.rot;
    const mag = Math.hypot(dx, dy);
    const nx = dx / mag, ny = dy / mag;
    this.isFlipping = true; this.hasFlipped = true; this.flipTime = 0;
    this.flipPitch = Math.abs(nx) < 0.1 ? 0 : nx;
    this.flipRoll = Math.abs(ny) < 0.1 ? 0 : ny;
    // Ejes horizontales (adelante y derecha aplanados)
    _ca.set(b.f.x, b.f.y, 0);
    if (_ca.lengthSq() < 0.01) _ca.set(b.l.y, -b.l.x, 0);
    _ca.normalize();
    _cb.set(_ca.y, -_ca.x, 0);
    const fwdSpeed = this.vel.dot(b.f);
    const ratio = Math.min(1, Math.abs(fwdSpeed) / C.maxSpeed);
    const back = Math.abs(fwdSpeed) < 100 ? nx < 0 : (nx >= 0) !== (fwdSpeed > 0);
    let ix = nx * D.impulse, iy = ny * D.impulse;
    ix *= back ? (1 + (D.backSpeedScale - 1) * ratio) * D.backScaleX : (1 + (D.forwardSpeedScale - 1) * ratio);
    iy *= 1 + (D.sideSpeedScale - 1) * ratio;
    this.vel.z = 0;
    this.vel.addScaled(_ca, ix).addScaled(_cb, iy);
  }

  /** Aceleración, freno, dirección y agarre lateral sobre la superficie de contacto. */
  driveGround(ctl, dt) {
    const C = CONFIG.car, N = this.groundNormal, f = this.rot.f;
    const cs = this.numContacts / 4;
    _ca.copy(f).addScaled(N, -f.dot(N));
    if (_ca.lengthSq() < 1e-4) return;
    _ca.normalize();                      // adelante sobre la superficie
    _cb.crossVectors(N, _ca);             // izquierda sobre la superficie
    const vF = this.vel.dot(_ca);
    const throttle = this.boosting ? 1 : ctl.throttle;
    let dvF;
    if (Math.abs(throttle) > C.throttleDeadzone) {
      if (vF * throttle < 0 && Math.abs(vF) > C.stoppingSpeed) dvF = -Math.sign(vF) * Math.min(C.brakeAccel * dt * cs, Math.abs(vF));
      else dvF = throttle * curve(C.throttleCurve, Math.abs(vF)) * dt * cs;
    } else {
      dvF = -Math.sign(vF) * Math.min(C.coastAccel * dt * cs, Math.abs(vF));
    }
    this.vel.addScaled(_ca, dvF);
    // Dirección: curvatura máxima según velocidad (mayor en derrape)
    const sp = Math.abs(vF);
    const curv = lerp(curve(C.steerCurvature, sp), curve(C.powerslideCurvature, sp), this.handbrakeAmt);
    const target = -ctl.steer * curv * vF;
    const wN = this.angVel.dot(N);
    this.angVel.addScaled(N, (target - wN) * Math.min(1, C.yawResponse * dt) * cs);
    // Agarre lateral (se reduce al deslizar y durante el derrape)
    const vF2 = this.vel.dot(_ca), vL = this.vel.dot(_cb);
    const planar = Math.sqrt(vF2 * vF2 + vL * vL);
    const slip = Math.abs(vL) / Math.max(planar, 1);
    const fric = curve(C.latSlipCurve, slip) * lerp(1, C.powerslideLatFactor, this.handbrakeAmt);
    const maxDv = C.latAccelMax * fric * dt * cs;
    this.vel.addScaled(_cb, -clamp(vL, -maxDv, maxDv));
  }

  updateWheelVisuals(ctl, dt) {
    const vF = this.vel.dot(this.rot.f);
    for (const w of this.wheels) {
      const target = w.contact ? vF / w.r : (ctl.throttle * 40 + (this.boosting ? 30 : 0));
      w.spinVel = w.contact ? target : lerp(w.spinVel, target, Math.min(1, 2 * dt));

/** Predicción de la pelota con el mismo código de física (sin autos). */
class BallPredictor {
  constructor(seconds = 4) {
    this.n = Math.round(seconds * TICK_RATE);

    this.vel = new Float32Array((this.n + 1) * 3);
    this.ball = new Ball();
    this.ball.sim = true;
    this.startTick = -1;
  }
  compute(ball, tick) {
    const b = this.ball.copyState(ball);
    this.store(0, b);
    for (let i = 1; i <= this.n; i++) { b.step(DT); this.store(i, b); }

  }

}

// =====================================================================
// PLACAS DE TURBO
// =====================================================================
function makePads() {
  const P = CONFIG.pads, pads = [];
  for (const [x, y] of P.big) pads.push({ x, y, big: true, active: true, timer: 0 });
  for (const [x, y] of P.small) pads.push({ x, y, big: false, active: true, timer: 0 });
  return pads;
}

// MUNDO — un paso fijo de simulación
// =====================================================================
const RESPAWN_SPOTS = [[-2304, -4608], [2304, -4608], [-2688, -4608], [2688, -4608]];

  constructor(opts = {}) {
