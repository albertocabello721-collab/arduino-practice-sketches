      if (touched) this.ball.collideArena();
    }
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) {
      if (rev) collideCars(this.cars[n - 1 - i], this.cars[n - 1 - j], this);
      else collideCars(this.cars[i], this.cars[j], this);
    }
    // Colisión contra la cancha al final: los empujones entre autos y la pelota no dejan autos dentro de paredes
    for (const car of this.cars) car.collideWorld();
    if (this.ballEnabled) this.ball.collideArena();
    this.updatePads();
    for (const car of this.cars) {
      for (const e of car.events) { e.car = car; this.events.push(e); }
      car.events.length = 0;
    }
    for (const e of this.ball.events) this.events.push(e);
    this.ball.events.length = 0;
    this.tick++;
  }
  onBallTouch(car, first, strength, p) {
    if (first) {
      this.touchLog.push({ car, tick: this.tick });
      if (this.touchLog.length > 16) this.touchLog.shift();
      this.events.push({ type: 'toque', car, strength, x: p.x, y: p.y, z: p.z });
    }
  }
  /** Golpe/demolición del atacante sobre la víctima (n: de atacante a víctima). */
  carBump(att, vic, n, p) {
    const CC = CONFIG.collision.carCar;
    if (att.bumpCooldown > 0 || att.demolished || vic.demolished) return false;
    _k5.subVectors(p, att.pos);
    if (_k5.dot(att.rot.f) < CC.bumpMinForward) return false;         // no fue con el frente
    _k5.subVectors(vic.pos, att.pos).normalize();
    const approach = att.vel.dot(_k5);
    if (approach < 150) return false;                                  // no va hacia la víctima
    att.bumpCooldown = CC.bumpCooldown;
    if (att.supersonic && att.team !== vic.team) {
      this.demolish(vic, att);
      return true;
    }
    const sp = att.vel.length();
    const amount = curve(vic.onGround ? CC.bumpGround : CC.bumpAir, sp);
    _k5.copy(att.vel).normalize();
    vic.vel.addScaled(_k5, amount);
    if (vic.onGround) vic.vel.addScaled(vic.rot.u, CC.bumpUp);
    vic.vel.clampLength(CONFIG.car.maxSpeed);
    this.events.push({ type: 'empujon', car: att, victim: vic, speed: sp, x: p.x, y: p.y, z: p.z });
    return true;
  }
  demolish(vic, att) {
    vic.demolished = true;
    vic.respawnTimer = CONFIG.collision.carCar.demoRespawn;
    vic.boosting = false;
    this.events.push({ type: 'demolicion', car: att, victim: vic, x: vic.pos.x, y: vic.pos.y, z: vic.pos.z });
  }
  respawn(car) {
    const side = car.team === 0 ? 1 : -1;
    let best = null, bestD = -1;
    for (const [x, y] of RESPAWN_SPOTS) {
      const px = x * side, py = y * side;
      let dmin = Infinity;
      for (const o of this.cars) if (o !== car && !o.demolished) dmin = Math.min(dmin, Math.hypot(o.pos.x - px, o.pos.y - py));
      if (dmin > bestD) { bestD = dmin; best = [px, py]; }
    }
    car.placeAt(best[0], best[1], side > 0 ? Math.PI / 2 : -Math.PI / 2);
    car.pos.z = CONFIG.car.restZ + 20;
    car.prevPos.copy(car.pos);
    this.events.push({ type: 'reaparece', car });
  }
  updatePads() {
    const P = CONFIG.pads;
    for (const pad of this.pads) {
      if (!pad.active) {
        pad.timer -= DT;
        if (pad.timer <= 0) { pad.active = true; pad.timer = 0; }
        continue;
      }
      const r = pad.big ? P.bigRadius : P.smallRadius;
      for (const car of this.cars) {
        if (car.demolished || car.boost >= CONFIG.boost.max || car.unlimitedBoost) continue;
        const dx = car.pos.x - pad.x, dy = car.pos.y - pad.y;
        if (dx * dx + dy * dy > r * r || car.pos.z > P.height) continue;
        car.boost = Math.min(CONFIG.boost.max, car.boost + (pad.big ? P.bigAmount : P.smallAmount));
        pad.active = false;
        pad.timer = pad.big ? P.bigRespawn : P.smallRespawn;
        this.events.push({ type: 'turbo', car, big: pad.big, x: pad.x, y: pad.y });
        break;
      }
    }
  }
  /** Último toque de un auto distinto de 'car' desde 'sinceTick'. */
  lastTouchBefore(tick) {
    for (let i = this.touchLog.length - 1; i >= 0; i--) if (this.touchLog[i].tick <= tick) return this.touchLog[i];
    return null;
  }
}

/** Distancia mínima (SDF) de las muestras de la caja del auto a la cancha (negativa = penetración). */
function hitboxMinSDF(car) {
  const H = CONFIG.car.hitboxHalf, b = car.rot, c = car.hitboxCenter(new V3()), n = new V3();
  let m = Infinity;
  for (const s of HITBOX_SAMPLES) {
    const lx = s[0] * H[0], ly = s[1] * H[1], lz = s[2] * H[2];
    m = Math.min(m, arenaSDF(c.x + b.f.x * lx + b.l.x * ly + b.u.x * lz, c.y + b.f.y * lx + b.l.y * ly + b.u.y * lz,
      c.z + b.f.z * lx + b.l.z * ly + b.u.z * lz, n));
  }
  return m;
}

// =====================================================================
// PARTIDO — reglas: saque, cuenta regresiva, reloj, goles, tiempo extra, repetición y estadísticas.
// Funciona sin render (pruebas) y con render (juego).
// =====================================================================
const MODES = { '1v1': 1, '2v2': 2, '3v3': 3, 'practica': 0 };
const BOT_NAMES = ['Relámpago', 'Cometa', 'Tornado', 'Brasa', 'Centella', 'Zafiro', 'Halcón', 'Pantera', 'Trueno', 'Nova', 'Ciclón', 'Jaguar', 'Aurora', 'Volcán'];
const DIFFICULTIES = ['facil', 'normal', 'dificil', 'experto'];
const DIFF_LABEL = { facil: 'Fácil', normal: 'Normal', dificil: 'Difícil', experto: 'Experto' };

/** Grabación circular de estados de física para la repetición. */
const CAR_STRIDE = 21;
class ReplayRecorder {
  constructor(cars, seconds = 8) {
    this.cars = cars;
    this.stride = 9 + cars.length * CAR_STRIDE;
    this.cap = Math.round(seconds * TICK_RATE);
    this.buf = new Float32Array(this.cap * this.stride);
    this.ticks = new Int32Array(this.cap);
    this.head = 0; this.count = 0;
  }
  record(world) {
    const o = this.head * this.stride, B = this.buf, b = world.ball;
    B[o] = b.pos.x; B[o + 1] = b.pos.y; B[o + 2] = b.pos.z;
    B[o + 3] = b.rot.f.x; B[o + 4] = b.rot.f.y; B[o + 5] = b.rot.f.z;
    B[o + 6] = b.rot.u.x; B[o + 7] = b.rot.u.y; B[o + 8] = b.rot.u.z;
    for (let i = 0; i < this.cars.length; i++) {
      const c = this.cars[i], q = o + 9 + i * CAR_STRIDE;
      B[q] = c.pos.x; B[q + 1] = c.pos.y; B[q + 2] = c.pos.z;
      B[q + 3] = c.rot.f.x; B[q + 4] = c.rot.f.y; B[q + 5] = c.rot.f.z;
      B[q + 6] = c.rot.u.x; B[q + 7] = c.rot.u.y; B[q + 8] = c.rot.u.z;
      B[q + 9] = c.boosting ? 1 : 0; B[q + 10] = c.supersonic ? 1 : 0; B[q + 11] = c.demolished ? 1 : 0; B[q + 12] = c.steerVis;
      for (let k = 0; k < 4; k++) { B[q + 13 + k] = c.wheels[k].susLen; B[q + 17 + k] = c.wheels[k].spin; }
    }
    this.ticks[this.head] = world.tick;
    this.head = (this.head + 1) % this.cap;
    this.count = Math.min(this.count + 1, this.cap);
  }
  /** Copia los cuadros con tick en [t0, t1] (ordenados). */
  extract(t0, t1) {
    const frames = [];
    for (let k = 0; k < this.count; k++) {
      const idx = (this.head - this.count + k + this.cap) % this.cap;
      const t = this.ticks[idx];
      if (t >= t0 && t <= t1) frames.push(this.buf.slice(idx * this.stride, (idx + 1) * this.stride));
    }
    return { frames, stride: this.stride, nCars: this.cars.length };
  }
}

/** Reproduce un clip escribiendo en autos y pelota "fantasma" que usan las mismas vistas. */
class ReplayPlayer {
  constructor(clip, cars) {
    this.clip = clip;
    this.t = 0;
    this.duration = Math.max(0, (clip.frames.length - 1) / TICK_RATE);
    this.ghostBall = new Ball();
    this.ghostCars = cars.map((c) => { const g = new Car(c.id, c.team, c.name); return g; });
    this.alpha = 0;
    this.done = clip.frames.length < 2;
    this.apply();
  }
  advance(dt) {
    this.t += dt;
    if (this.t >= this.duration) { this.t = this.duration; this.done = true; }
    this.apply();
  }
  apply() {
    const F = this.clip.frames;
    if (F.length === 0) return;
    const f = this.t * TICK_RATE;
    const i = Math.min(F.length - 1, Math.floor(f)), j = Math.min(F.length - 1, i + 1);
    this.alpha = clamp(f - i, 0, 1);
    this.setFrom(F[i], true); this.setFrom(F[j], false);
  }
  setFrom(A, prev) {
    const b = this.ghostBall;
    const pos = prev ? b.prevPos : b.pos, rot = prev ? b.prevRot : b.rot;
    pos.set(A[0], A[1], A[2]); rot.f.set(A[3], A[4], A[5]); rot.u.set(A[6], A[7], A[8]); rot.orthonormalize();
    for (let i = 0; i < this.ghostCars.length; i++) {
      const c = this.ghostCars[i], q = 9 + i * CAR_STRIDE;
      const p = prev ? c.prevPos : c.pos, r = prev ? c.prevRot : c.rot;
      p.set(A[q], A[q + 1], A[q + 2]); r.f.set(A[q + 3], A[q + 4], A[q + 5]); r.u.set(A[q + 6], A[q + 7], A[q + 8]); r.orthonormalize();
      if (!prev) {
        c.boosting = A[q + 9] > 0.5; c.supersonic = A[q + 10] > 0.5; c.demolished = A[q + 11] > 0.5; c.steerVis = A[q + 12];
        for (let k = 0; k < 4; k++) { c.wheels[k].susLen = A[q + 13 + k]; c.wheels[k].spin = A[q + 17 + k]; }
        c.vel.subVectors(c.pos, c.prevPos).scale(TICK_RATE);
        c.onGround = true;
      }
    }
    if (!prev) b.vel.subVectors(b.pos, b.prevPos).scale(TICK_RATE);
  }
}

class Match {
  constructor(opts = {}) {
    this.opts = opts;
    this.mode = opts.mode || '1v1';
    this.practice = this.mode === 'practica';
    this.teamSize = MODES[this.mode] || 1;
    this.difficulty = opts.difficulty || 'normal';
    this.headless = !!opts.headless;
    this.rng = new Rng(opts.seed || 1);
    this.world = new World({ seed: 1 + this.rng.int(1e9) });
    this.cars = []; this.controllers = [];
    const names = BOT_NAMES.slice();
    for (let i = names.length - 1; i > 0; i--) { const j = this.rng.int(i + 1); const t = names[i]; names[i] = names[j]; names[j] = t; }
    let id = 0;
    const humanCount = opts.humanPlayer === false ? 0 : 1;
    for (let team = 0; team < 2; team++) {
      const n = this.practice ? (team === 0 ? 1 : 0) : this.teamSize;
      for (let k = 0; k < n; k++) {
        const human = team === 0 && k === 0 && humanCount > 0;
        const car = new Car(id++, team, human ? (opts.playerName || 'Tú') : names.pop());
        car.isBot = !human;
        if (this.practice && opts.unlimitedBoost) car.unlimitedBoost = true;
        this.world.addCar(car);
        this.cars.push(car);
        this.controllers.push({ kind: human ? 'humano' : 'bot', brain: null });
      }
    }
    this.human = this.cars.find((c, i) => this.controllers[i].kind === 'humano') || null;
    this.stats = new Map();
    for (const c of this.cars) this.stats.set(c, { goals: 0, assists: 0, saves: 0, shots: 0, demos: 0, touches: 0, points: 0 });
    this.score = [0, 0];
    this.clock = CONFIG.match.duration;
    this.clockRunning = false;
    this.overtime = false; this.otTime = 0;
    this.zeroWait = false;           // 0:00 esperando que la pelota toque el piso
    this.state = 'cuenta'; this.stateTime = 0;
    this.events = [];
    this.predictor = new BallPredictor(4);      // compartida por los bots
    this.predTick = -1;
    this.statPred = new BallPredictor(6);       // solo al tocar la pelota (tiros y salvadas)
    this.preBall = new Ball(); this.preBall.sim = true;
    this.threat = 0;
    this.lastShot = new Map(); this.lastSave = new Map();
    this.replay = this.headless ? null : new ReplayRecorder(this.cars);
    this.replayPlayer = null;
    this.goalInfo = null;
    this.winner = -1; this.mvp = null;
    this.lastCountdown = 4;
    this.kickoffIndex = 0;
    this.lastMinuteWarned = false;
    if (opts.botFactory) {
      this.cars.forEach((c, i) => { if (this.controllers[i].kind === 'bot') this.controllers[i].brain = opts.botFactory(c, this, this.difficulty); });
    }
    this.kickoff();
  }
  team(t) { return this.cars.filter((c) => c.team === t); }
  /** Saque: posiciones aleatorias según el tamaño de equipo, iguales (espejo en y) para ambos. */
  kickoff() {
    const W = this.world;
    W.ballEnabled = true;
    W.ball.reset(0, 0, CONFIG.ball.spawnZ);
    W.ball.rot = new Basis();
    W.ball.prevRot.copy(W.ball.rot);
    for (const pad of W.pads) { pad.active = true; pad.timer = 0; }
    const spots = CONFIG.match.kickoffSpots.map((s) => s.slice());
    for (let i = spots.length - 1; i > 0; i--) { const j = this.rng.int(i + 1); const t = spots[i]; spots[i] = spots[j]; spots[j] = t; }
    for (let team = 0; team < 2; team++) {
      const members = this.team(team);
      members.forEach((car, k) => {
        let [x, y] = spots[k % spots.length];
        if (this.practice) { x = 0; y = -2560; }
        if (team === 1) y = -y;
        car.placeAt(x, y, Math.atan2(-y, -x));
        car.boost = CONFIG.boost.kickoffAmount;
        car.controls.reset();
      });
    }
    W.touchLog.length = 0;
    this.touchesSinceKickoff = 0;
    this.state = this.practice ? 'jugando' : 'cuenta';
    this.stateTime = 0;
    this.lastCountdown = 4;
    this.predTick = -1;
    this.threat = 0;
    this.kickoffIndex++;
    this.events.push({ type: 'saque' });
    for (let i = 0; i < this.cars.length; i++) { const br = this.controllers[i].brain; if (br && br.onKickoff) br.onKickoff(); }
  }
  prediction() {
    if (this.predTick !== this.world.tick) { this.predictor.compute(this.world.ball, this.world.tick); this.predTick = this.world.tick; }
    return this.predictor;
  }
  /** Lado de la portería hacia la que va la pelota (+1 naranja, −1 azul, 0 ninguna) en los próximos 4 s. */
  threatSide(pred) {
    if (pred.goalIndex(1) >= 0) return 1;
    if (pred.goalIndex(-1) >= 0) return -1;
    return 0;
  }
  addPoints(car, key, n = 1) {
    const s = this.stats.get(car);
    if (!s) return;
    const P = CONFIG.match.points;
    const field = { goal: 'goals', assist: 'assists', save: 'saves', shot: 'shots', demo: 'demos', touch: 'touches' }[key];
    s[field] += n;
    s.points += P[key] * n;
  }
  /** Avanza un tick fijo. humanControls: Controls del jugador (o null). */
  tick(humanControls) {
    this.events.length = 0;
    this.stateTime += DT;
    const W = this.world;
    switch (this.state) {
      case 'cuenta': {
        for (const c of this.cars) c.controls.reset();
        const n = Math.ceil(CONFIG.match.countdown - this.stateTime);
        if (n < this.lastCountdown && n > 0) { this.lastCountdown = n; this.events.push({ type: 'cuenta', n }); }
        W.step();
        if (this.replay) this.replay.record(W);
        this.forwardWorldEvents();
        if (this.stateTime >= CONFIG.match.countdown) {
          this.state = 'jugando'; this.stateTime = 0;
          this.events.push({ type: 'ya' });
        }
        break;
      }
      case 'jugando': {
        this.preBall.copyState(W.ball);
        this.gatherControls(humanControls);
        W.step();
        if (this.replay) this.replay.record(W);
        this.forwardWorldEvents();
        this.processTouches();
        if (this.practice) { this.checkGoalPractice(); break; }
        if (this.clockRunning && !this.zeroWait) {
          if (this.overtime) this.otTime += DT;
          else {
            this.clock = Math.max(0, this.clock - DT);
            if (!this.lastMinuteWarned && this.clock <= 60) { this.lastMinuteWarned = true; this.events.push({ type: 'ultimoMinuto' }); }
            if (this.clock <= 0) { this.zeroWait = true; this.events.push({ type: 'tiempoCero' }); }
          }
        }
        if (this.checkGoal()) break;
        if (this.zeroWait) {
          const b = W.ball;
          if (b.pos.z <= CONFIG.ball.radius + 3 && Math.abs(b.pos.y) < AR.YB) {
            if (this.score[0] !== this.score[1]) this.endMatch();
            else this.startOvertime();
          }
        }
        break;
      }
      case 'gol': {
        this.gatherControls(humanControls);
        W.step();
        if (this.replay) this.replay.record(W);
        this.forwardWorldEvents();
        if (this.stateTime >= CONFIG.match.goalCelebration) {
          if (this.headless || !this.goalInfo || !this.replay) this.afterGoal();
          else {
            const g = this.goalInfo.tick;
            const clip = this.replay.extract(g - Math.round(CONFIG.match.replayBefore * TICK_RATE), g + Math.round(CONFIG.match.replayAfter * TICK_RATE));
            this.replayPlayer = new ReplayPlayer(clip, this.cars);
            this.state = 'repeticion'; this.stateTime = 0;
            this.events.push({ type: 'repeticion' });
          }
        }
        break;
      }
      case 'repeticion': {
        this.replayPlayer.advance(DT);
        if (this.replayPlayer.done) this.skipReplay();
        break;
      }
      case 'fin':
      default: {
        for (const c of this.cars) c.controls.reset();
        W.step();
        this.forwardWorldEvents();
        break;
      }
    }
  }
  skipReplay() {
    if (this.state !== 'repeticion') return;
    this.replayPlayer = null;
    this.events.push({ type: 'finRepeticion' });
    this.afterGoal();
  }
  gatherControls(humanControls) {
    for (let i = 0; i < this.cars.length; i++) {
      const car = this.cars[i], ctl = this.controllers[i];
      if (ctl.kind === 'humano') { if (humanControls) car.controls.copy(humanControls); else car.controls.reset(); }
      else if (ctl.brain) ctl.brain.update(DT);
      else car.controls.reset();
    }
  }
  forwardWorldEvents() {
    for (const e of this.world.events) {
      this.events.push(e);
      if (e.type === 'demolicion' && e.car && e.victim && e.car.team !== e.victim.team) {
        this.addPoints(e.car, 'demo');
        this.events.push({ type: 'avisoDemolicion', car: e.car, victim: e.victim });
      }
    }
  }
  processTouches() {
    const touches = this.world.events.filter((e) => e.type === 'toque');
    if (!touches.length) return;
    if (!this.clockRunning && !this.practice) { this.clockRunning = true; this.events.push({ type: 'relojInicia' }); }
    this.touchesSinceKickoff += touches.length;
    // amenaza antes (sin el toque) y después del toque, con horizonte de 6 s
    const threatBefore = this.threatSide(this.statPred.compute(this.preBall, this.world.tick));
    const after = this.threatSide(this.statPred.compute(this.world.ball, this.world.tick));
    this.predTick = -1;
    const now = this.world.tick / TICK_RATE;
    for (const t of touches) {
      const car = t.car;
      this.addPoints(car, 'touch');
      const own = car.team === 0 ? -1 : 1;     // lado de su propia portería
      if (threatBefore === own && after !== own) {
        if (!(now - (this.lastSave.get(car) || -99) < CONFIG.match.statCooldown)) {
          this.lastSave.set(car, now);
          this.addPoints(car, 'save');
          this.events.push({ type: 'salvada', car });
        }
      }
      if (after === -own && threatBefore !== -own) {
        if (!(now - (this.lastShot.get(car) || -99) < CONFIG.match.statCooldown)) {
          this.lastShot.set(car, now);
          this.addPoints(car, 'shot');
          this.events.push({ type: 'tiro', car });
        }
      }
    }
  }
  /** Devuelve true si hubo gol este tick. */
  checkGoal() {
    const b = this.world.ball, lim = CONFIG.match.goalLine + CONFIG.ball.radius;
    if (Math.abs(b.pos.y) <= lim) return false;
    const side = b.pos.y > 0 ? 1 : -1;
    const scoringTeam = side > 0 ? 0 : 1;
    this.score[scoringTeam]++;
    // Anotador: último toque del equipo que anota; asistencia: toque previo de un compañero (≤ 5 s)
    const log = this.world.touchLog, tickNow = this.world.tick;
    let scorer = null, scorerIdx = -1;
    for (let i = log.length - 1; i >= 0; i--) if (log[i].car.team === scoringTeam) { scorer = log[i].car; scorerIdx = i; break; }
    let assist = null;
    if (scorer) {
      for (let i = scorerIdx - 1; i >= 0; i--) {
        const e = log[i];
        if (tickNow - e.tick > CONFIG.match.assistWindow * TICK_RATE) break;
        if (e.car === scorer) continue;
        if (e.car.team !== scoringTeam) break;
        assist = e.car; break;
      }
    }
    const lastToucher = log.length ? log[log.length - 1].car : null;
    const ownGoal = !!lastToucher && lastToucher.team !== scoringTeam;
    if (scorer) {
      this.addPoints(scorer, 'goal');
      // todo gol cuenta como tiro (si el toque que anotó no se registró ya como tiro)
      const lastT = log[scorerIdx].tick / TICK_RATE;
      if ((this.lastShot.get(scorer) || -99) < lastT - 1e-6) { this.lastShot.set(scorer, lastT); this.addPoints(scorer, 'shot'); }
    }
    if (assist) this.addPoints(assist, 'assist');
    this.goalInfo = { tick: tickNow, team: scoringTeam, scorer, assist, ownGoal, speed: b.vel.length(), x: b.pos.x, y: b.pos.y, z: b.pos.z, side };
    this.events.push(Object.assign({ type: 'gol' }, this.goalInfo));
    this.world.ballEnabled = false;
    this.state = 'gol'; this.stateTime = 0;
    return true;
  }
  checkGoalPractice() {
    const b = this.world.ball, lim = CONFIG.match.goalLine + CONFIG.ball.radius;
    if (Math.abs(b.pos.y) <= lim) return;
    const side = b.pos.y > 0 ? 1 : -1;
    this.events.push({ type: 'gol', team: side > 0 ? 0 : 1, scorer: this.human, assist: null, ownGoal: false, speed: b.vel.length(), x: b.pos.x, y: b.pos.y, z: b.pos.z, side, practice: true });
    this.world.ball.reset(0, 0, CONFIG.ball.spawnZ + 300);
  }
  resetBallPractice() {
    if (!this.practice) return;
    this.world.ball.reset(0, 0, CONFIG.ball.spawnZ + 300);
    this.events.push({ type: 'pelotaReiniciada' });
  }
  afterGoal() {
    this.goalInfo = null;
    if (this.overtime) { this.endMatch(); return; }
    if (this.clock <= 0) {
      if (this.score[0] !== this.score[1]) { this.endMatch(); return; }
      this.startOvertime();
      return;
    }
    this.kickoff();
  }
  startOvertime() {
    this.overtime = true; this.zeroWait = false; this.otTime = 0;
    this.clockRunning = false;
    this.events.push({ type: 'tiempoExtra' });
    this.kickoff();
  }
  endMatch() {
    this.state = 'fin'; this.stateTime = 0;
    this.winner = this.score[0] > this.score[1] ? 0 : (this.score[1] > this.score[0] ? 1 : -1);
    let best = null, bestPts = -1;
    for (const c of this.cars) {
      const s = this.stats.get(c);
      const pts = s.points + (c.team === this.winner ? 0.5 : 0);
      if (c.team === this.winner && pts > bestPts) { bestPts = pts; best = c; }
    }
    this.mvp = best;
    this.events.push({ type: 'fin', winner: this.winner, mvp: best });
  }
  clockText() {
    const fmt = (t) => { const s = Math.max(0, Math.ceil(t - 1e-6)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
    if (this.practice) return 'PRÁCTICA';
    if (this.overtime) { const s = Math.floor(this.otTime); return '+' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
    return fmt(this.clock);
  }
  isFinite() {
    return this.world.ball.isFinite() && this.cars.every((c) => c.isFinite());
  }
}

// =====================================================================
// BOTS — IA con los mismos controles que el jugador.
// Predicción de 4 s (mismo código de física), intercepción alcanzable, roles de equipo con
// rotación (nunca dos a la misma pelota, uno siempre atrás) y parámetros por dificultad.
// =====================================================================
const JUMP_TABLE = (() => {
  // altura del centro de masa sobre el reposo en cada tick: salto completo y doble salto (2º a los 0.25 s)
  const J = CONFIG.jump, g = CONFIG.physics.gravity;
  const single = [], dbl = [];
  let z = 0, v = J.impulse, z2 = 0, v2 = J.impulse;
  for (let i = 1; i <= 240; i++) {
    const t = i * DT;
    const a = -g + (t <= J.maxHold + 1e-9 ? J.holdAccel : 0);
    v += a * DT; z += v * DT; single.push(z);
    v2 += a * DT; if (i === Math.round(0.25 * TICK_RATE)) v2 += J.impulse; z2 += v2 * DT; dbl.push(z2);
  }
  return { single, dbl, maxSingle: Math.max(...single), maxDouble: Math.max(...dbl) };
})();
/** Tiempo (s) desde el inicio del salto hasta alcanzar la altura h subiendo; -1 si no llega. */
function jumpTimeFor(h, double) {
  const arr = double ? JUMP_TABLE.dbl : JUMP_TABLE.single;
  for (let i = 0; i < arr.length; i++) {
    if (arr[i] >= h) return (i + 1) * DT;
    if (i > 0 && arr[i] < arr[i - 1]) break;
  }
  return -1;
}

const _b1 = new V3(), _b2 = new V3(), _b3 = new V3(), _b4 = new V3(), _b5 = new V3(), _botN = new V3();

/** Planificador de roles por equipo: primero (va a la pelota), segundo (apoyo/sombra), tercero (atrás). */
class TeamPlanner {
  constructor(match, team) {
    this.match = match; this.team = team;
    this.roles = new Map(); this.lastTick = -1e9; this.first = null;
  }
  update() {
    const m = this.match, W = m.world;
    if (W.tick - this.lastTick < CONFIG.bots.roleInterval * TICK_RATE) return;
    this.lastTick = W.tick;
    const members = m.cars.filter((c) => c.team === this.team && !c.demolished);
    const pred = m.prediction();
    const scored = members.map((c) => ({ c, s: this.score(c, pred) }));
    scored.sort((a, b) => a.s - b.s);
    // histéresis: el primero actual conserva el rol salvo que otro sea claramente mejor
    if (this.first && scored.length > 1 && !this.first.demolished) {
      const cur = scored.find((x) => x.c === this.first);
      if (cur && cur !== scored[0] && cur.s - scored[0].s < CONFIG.bots.roleHysteresis) {
        scored.splice(scored.indexOf(cur), 1); scored.unshift(cur);
      }
    }
    this.roles.clear();
    const names = ['primero', 'segundo', 'tercero'];
    scored.forEach((x, i) => this.roles.set(x.c, names[Math.min(i, 2)]));
    // con 2 jugadores, el segundo cubre atrás (tercero)
    if (scored.length === 2) this.roles.set(scored[1].c, 'tercero');
    this.first = scored.length ? scored[0].c : null;
    // Peligro en la propia portería: un único "salvador" (el bot que llega antes), los demás a la línea
    const own = this.team === 0 ? -1 : 1;
    this.danger = pred.goalIndex(own);
    this.saver = null;
    if (this.danger >= 0) {
      let best = Infinity;
      for (const c of members) {
        if (!c.isBot) continue;
        const t = quickIntercept(c, pred) - (c === this.saverPrev ? 0.25 : 0);
        if (t < best) { best = t; this.saver = c; }
      }
    }
    this.saverPrev = this.saver;
  }
  /** Puntaje (s): tiempo estimado para llegar a la pelota + penalizaciones de posición. */
  score(car, pred) {
    const side = car.team === 0 ? 1 : -1;       // dirección de ataque en y
    const t = quickIntercept(car, pred);
    const b = this.match.world.ball;
    let s = t;
    if ((car.pos.y - b.pos.y) * side > 250) s += 1.2 + (car.pos.y - b.pos.y) * side / 2500;   // del lado equivocado de la pelota
    if (car.isBot === false) {
      // al humano solo se le cede la pelota si realmente va hacia ella
      const dx = b.pos.x - car.pos.x, dy = b.pos.y - car.pos.y, d = Math.hypot(dx, dy) || 1;
      const chasing = (car.vel.x * dx + car.vel.y * dy) / d > 400 && d < 3500;
      s += chasing ? -0.2 : 2.0;
    }
    return s;
  }
  role(car) { this.update(); return this.roles.get(car) || 'segundo'; }
}

/** Tiempo aproximado de viaje hasta un punto (x, y, z) llegando con dirección (adx, ady) opcional. */
function travelTime(car, x, y, z, useBoost, adx = 0, ady = 0) {
  const dx = x - car.pos.x, dy = y - car.pos.y, dz = z - car.pos.z;
  const dist = Math.sqrt(dx * dx + dy * dy + (car.onGround && car.groundNormal.z < 0.7 ? dz * dz : 0));
  const f = car.rot.f;
  let fx = f.x, fy = f.y;
  const fl = Math.hypot(fx, fy) || 1; fx /= fl; fy /= fl;
  const dl = Math.max(dist, 1);
  const cosA = clamp((fx * dx + fy * dy) / dl, -1, 1);
  const ang = Math.acos(cosA);
  const v0 = Math.max(0, car.vel.dot(car.rot.f));
  const boostOk = useBoost && car.boost > 8;
  const vmax = boostOk ? 2300 : 1410, acc = boostOk ? 1900 : 950;
  const tAcc = Math.max(0, (vmax - v0) / acc), dAcc = (v0 + vmax) / 2 * tAcc;
  let t = dist <= dAcc ? (-v0 + Math.sqrt(v0 * v0 + 2 * acc * dist)) / acc : tAcc + (dist - dAcc) / vmax;
  t += ang * (ang > 1.6 ? 0.42 : 0.3) * clamp(v0 / 1400 + 0.4, 0.4, 1.2);
  if (adx || ady) {
    const al = Math.hypot(adx, ady) || 1;
    const c2 = clamp((dx * adx + dy * ady) / (dl * al), -1, 1);
    t += Math.acos(c2) * 0.35;
  }
  if (!car.onGround) t += 0.25;
  return t;
}
/** Intercepción rápida (para asignar roles): primer instante alcanzable de la pelota a baja altura. */
function quickIntercept(car, pred) {
  const step = 6;
  for (let i = 6; i <= pred.n; i += step) {
    const j = i * 3;
    const z = pred.pos[j + 2];
    if (z > 400) continue;
    const t = travelTime(car, pred.pos[j], pred.pos[j + 1], z, true);
    if (t <= i * DT) return i * DT;
  }
  const j = pred.n * 3;
  return pred.n * DT + Math.hypot(pred.pos[j] - car.pos.x, pred.pos[j + 1] - car.pos.y) / 1400;
}

class BotBrain {
  constructor(car, match, difficulty) {
    this.car = car; this.match = match;
    this.diffName = difficulty;
    this.D = CONFIG.bots[difficulty] || CONFIG.bots.normal;
    this.rng = new Rng(7919 * (car.id + 1) + match.rng.int(1e6));
    this.state = 'saque'; this.role = 'segundo';
    this.thinkTimer = 0;
    this.plan = null;
    this.target = new V3(); this.targetSpeed = 2300; this.allowBoost = true; this.stopAtTarget = false; this.faceBall = false;
    this.seq = null; this.seqT = 0; this.seqI = 0;
    this.aerial = null;
    this.kickoffDodged = false;
    this.aimNoise = 0;
    this.stuckTimer = 0;
    this.debugColor = car.team === 0 ? 0x66b3ff : 0xffaa55;
  }
  get planner() {
    const m = this.match;
    if (!m.teamPlanners) m.teamPlanners = [new TeamPlanner(m, 0), new TeamPlanner(m, 1)];
    return m.teamPlanners[this.car.team];
  }
  onKickoff() {
    this.seq = null; this.aerial = null; this.plan = null; this.state = 'saque';
    this.kickoffDodged = false; this.thinkTimer = 0;
    this.aimNoise = (this.rng.next() * 2 - 1) * this.D.aimNoise;
    // variación del saque: punto de impacto y distancia del dodge
    this.kickoffOffset = (this.rng.next() * 2 - 1) * (40 + this.D.aimNoise * 0.12);
    this.kickoffDodgeExtra = (this.rng.next() * 2 - 1) * 45;
  }
  get attackSide() { return this.car.team === 0 ? 1 : -1; }  // +1: ataca hacia +y
  now() { return this.match.world.tick * DT; }

  update(dt) {
    const car = this.car, ctl = car.controls;
    ctl.reset();
    if (car.demolished) { this.seq = null; this.aerial = null; this.plan = null; this.state = 'demolido'; this.thinkTimer = 0; return; }
    if (this.seq && this.runSequence(dt, ctl)) return;
    if (this.aerial && this.runAerial(dt, ctl)) return;
    this.thinkTimer -= dt;
    if (this.thinkTimer <= 0) {
      this.think();
      this.thinkTimer = this.D.reaction * (0.75 + 0.5 * this.rng.next());
    }
    if (car.numContacts === 0 && !car.onGround) { this.recover(ctl); return; }
    this.act(dt, ctl);
  }

  // ------------------------------------------------------------ decisiones
  think() {
    const m = this.match, car = this.car, W = m.world, b = W.ball;
    if (m.touchesSinceKickoff === 0 && !m.practice) { this.state = 'saque'; this.thinkKickoff(); return; }
    const pred = m.prediction();
    this.role = this.planner.role(car);
    const own = -this.attackSide;               // lado de la propia portería
    const danger = pred.goalIndex(own);         // índice en que la pelota entraría en la propia portería
    const ownGoalY = own * AR.YB;
    this.faceBall = false; this.stopAtTarget = false; this.allowBoost = true; this.targetSpeed = 2300 * this.D.speedScale;
    const P = this.planner;
    if (danger >= 0) {
      if (P.saver === car) {
        const plan = this.findIntercept(pred, true);
        this.plan = plan || this.goalLinePlan(pred, danger);
        this.state = 'salvada';
        return;
      }
      if (this.role !== 'primero' || P.saver) { this.state = 'portero'; this.keeperTarget(pred, true); return; }
    }
    if (this.role === 'primero') {
      // Si no está del lado de su portería y la pelota viene hacia ella, volver primero (por el palo lejano)
      const goalSide = (car.pos.y - b.pos.y) * this.attackSide < 150;
      const coming = b.vel.y * this.attackSide < -350 || b.pos.y * this.attackSide < -2500;
      const plan = this.findIntercept(pred, false);
      const planOk = plan && (goalSide || !coming || this.planFromBehind(plan));
      if (planOk) { this.plan = plan; this.state = 'ataque'; return; }
      if (!goalSide && coming) { this.state = 'rotacion'; this.retreatTarget(); return; }
      const chase = this.chasePlan(pred);
      if (chase) { this.plan = chase; this.state = 'ataque'; return; }
    }
    // Roles de apoyo
    const behindBall = (car.pos.y - b.pos.y) * this.attackSide < -200;
    if (this.role === 'segundo') {
      if (car.boost < 35 + this.D.minBoost && b.pos.y * this.attackSide > -1500 && this.pickBoostTarget(true)) { this.state = 'turbo'; return; }
      if (!behindBall) { this.state = 'rotacion'; this.rotationTarget(pred); return; }
      this.state = 'sombra'; this.shadowTarget(pred, 1900); return;
    }
    // tercero / último: cubrir la portería, rotando por el palo lejano
    if (!behindBall && Math.abs(car.pos.y - ownGoalY) > 2500) { this.state = 'rotacion'; this.rotationTarget(pred); return; }
    if (car.boost < 20 && b.pos.y * this.attackSide > 1500 && this.pickBoostTarget(false)) { this.state = 'turbo'; return; }
    this.state = 'portero'; this.keeperTarget(pred);
  }
  canBeatTeammates(pred) {
    const my = quickIntercept(this.car, pred);
    for (const c of this.match.cars) {
      if (c === this.car || c.team !== this.car.team || c.demolished) continue;
      if (quickIntercept(c, pred) + this.D.challengeMargin < my) return false;
    }
    return true;
  }
  thinkKickoff() {
    const m = this.match, car = this.car;
    const mates = m.cars.filter((c) => c.team === car.team && !c.demolished);
    // quien saca: el más cercano (desempate: el de la izquierda de su equipo)
    let taker = null, best = Infinity;
    for (const c of mates) {
      const d = Math.hypot(c.pos.x, c.pos.y) + (c.pos.x * this.attackSide < 0 ? 0 : 1);
      if (d < best - 1e-6) { best = d; taker = c; }
    }
    this.kickoffTaker = taker === car;
    if (this.kickoffTaker) { this.target.set(0, 0, CONFIG.ball.radius); return; }
    const byDist = mates.slice().sort((a, b) => Math.hypot(a.pos.x, a.pos.y) - Math.hypot(b.pos.x, b.pos.y));
    const rank = byDist.indexOf(car);
    const own = -this.attackSide;
    if (rank === 1 && mates.length >= 2) {
      // segundo: turbo grande de su esquina y luego apoyo
      const sx = car.pos.x >= 0 ? 1 : -1;
      this.target.set(sx * 3072, own * 4096, 17);
      this.plan = null;
    } else {
      this.target.set(0, own * (AR.YB - 600), 17);
    }
  }
  /** Elige entre la primera intercepción a ras de piso y la primera por el aire (solo si es claramente antes). */
  findIntercept(pred, defending) {
    const ground = this.searchIntercept(pred, defending, true);
    const air = this.searchIntercept(pred, defending, false);
    let plan = ground;
    const margin = this.D.reaction < 0.1 ? 0.45 : 0.7;
    if (air && (!ground || air.t + margin < ground.t)) plan = air;
    // mantener el plan anterior si es casi el mismo (evita titubeos)
    const old = this.plan;
    if (plan && old && old.kind === plan.kind && !old.chase && Math.abs(old.t - plan.t) < 0.2 && old.t > this.now() + 0.1 &&
        Math.hypot(old.bx - plan.bx, old.by - plan.by) < 250) return old;
    return plan;
  }
  /** Busca el primer punto de la predicción alcanzable (solo piso o solo aire) y arma el plan de golpe. */
  searchIntercept(pred, defending, groundOnly) {
    const car = this.car, D = this.D, step = CONFIG.bots.predictionStep;
    // al defender, llegar con margen para plantarse de frente a la pelota (salvo que ya no haya tiempo)
    const margin = defending ? 0.35 : 0;
    const R = CONFIG.ball.radius;
    const oppGoalY = this.attackSide * (AR.YB + 300);
    const own = -this.attackSide;
    const canBoost = D.boostUse > 0.3;
    for (let i = step; i <= pred.n; i += step) {
      const j = i * 3;
      const bx = pred.pos[j], by = pred.pos[j + 1], bz = pred.pos[j + 2];
      const t = i * DT;
      // dirección del tiro: hacia la portería rival (con error), o despejar hacia un costado si defiende muy cerca
      let ax = clamp(bx * 0.35, -500, 500) + this.aimNoise, ay = oppGoalY;
      if (defending && Math.abs(by - own * AR.YB) < 1800 && (by - own * AR.YB) * own > -1800) {
        ax = (bx >= 0 ? 1 : -1) * 3800; ay = by + this.attackSide * 1500;
      }
      let sdx = ax - bx, sdy = ay - by;
      const sl = Math.hypot(sdx, sdy) || 1; sdx /= sl; sdy /= sl;
      // clasificar la altura
      const onWall = Math.abs(bx) > AR.Xq + 150 || Math.abs(by) > AR.Yq + 200 && Math.abs(bx) > AR.W + 150;
      let kind;
      const h = bz - R * 0.55 - CONFIG.car.restZ;   // altura necesaria del centro de masa
      if (bz <= 175) kind = 'suelo';
      else if (groundOnly) continue;
      else if (onWall && D.wallShots && bz < 1500) kind = 'pared';
      else if (D.jumpShots && h <= JUMP_TABLE.maxSingle - 8) kind = 'salto';
      else if (D.doubleJump && h <= JUMP_TABLE.maxDouble - 15) kind = 'doble';
      else if (D.aerial && bz <= D.aerialMaxZ && car.boost >= 25 && t > 0.7 && arenaSDF(bx, by, bz, _botN) > 420) kind = 'aereo';
      else continue;
      if (onWall && kind !== 'pared' && bz > 300) continue;
      // punto de contacto del centro de masa del auto
      const back = kind === 'suelo' ? R + 60 : (kind === 'pared' ? R + 40 : R + 30);
      const cx = bx - sdx * back, cy = by - sdy * back;
      let need = travelTime(car, cx, cy, kind === 'pared' ? bz : 17, canBoost, sdx, sdy);
      if (kind === 'salto') need += 0.05;
      if (kind === 'doble') need += 0.15;
      if (kind === 'aereo') {
        if (!this.aerialFeasible(bx - sdx * 60, by - sdy * 60, bz, t)) continue;
        need = Math.max(need * 0.6, 0.5);
      }
      const goalNear = defending && pred.pos[Math.min(pred.n, i + 36) * 3 + 1] * own > AR.YB - 200;
      if (need + (goalNear ? 0 : margin) <= t + 0.04) {
        return { kind, t: this.now() + t, i, bx, by, bz, cx, cy, sdx, sdy, jumped: false };
      }
    }
    return null;
  }
  /** ¿El plan permite golpear desde el lado de la propia portería (sin rodear la pelota)? */
  planFromBehind(p) {
    const car = this.car;
    const relx = car.pos.x - p.bx, rely = car.pos.y - p.by;
    return relx * p.sdx + rely * p.sdy < -100;
  }
  /** Retroceder hacia la propia portería por el palo lejano para quedar entre la pelota y el arco. */
  retreatTarget() {
    const own = -this.attackSide, b = this.match.world.ball, car = this.car;
    const farX = b.pos.x >= 0 ? -1 : 1;
    const y = clamp(b.pos.y + own * 1400, -(AR.Yq - 250), AR.Yq - 250);
    const deep = Math.abs(y - own * AR.YB) < 1200;
    this.target.set(deep ? farX * 700 : clamp(b.pos.x * 0.4 + farX * 900, -3000, 3000), deep ? own * (AR.YB - 450) : y, 17);
    this.targetSpeed = 2300 * this.D.speedScale;
    this.allowBoost = this.D.boostUse > 0.4 && car.boost > 15;
    this.stopAtTarget = false; this.faceBall = false;
  }
  /** Sin intercepción clara: perseguir la pelota por detrás (hacia donde estará en ~1.5 s), a nivel del piso. */
  chasePlan(pred) {
    const car = this.car, R = CONFIG.ball.radius;
    let best = -1;
    for (let i = 12; i <= pred.n; i += 6) {
      const j = i * 3;
      if (pred.pos[j + 2] < 400 && Math.abs(pred.pos[j]) < AR.Xq && Math.abs(pred.pos[j + 1]) < AR.Yq) { best = i; if (i * DT >= 1.2) break; }
    }
    if (best < 0) best = Math.min(pred.n, Math.round(1.5 * TICK_RATE));
    const j = best * 3;
    const bx = pred.pos[j], by = pred.pos[j + 1], bz = Math.min(pred.pos[j + 2], 150);
    const oppGoalY = this.attackSide * (AR.YB + 300);
    let sdx = clamp(bx * 0.35, -500, 500) - bx, sdy = oppGoalY - by;
    const sl = Math.hypot(sdx, sdy) || 1; sdx /= sl; sdy /= sl;
    const back = R + 60;
    return { kind: 'suelo', t: this.now() + Math.max(best * DT, travelTime(car, bx, by, 17, true)), i: best, bx, by, bz,
      cx: bx - sdx * back, cy: by - sdy * back, sdx, sdy, jumped: false, chase: true };
  }
  goalLinePlan(pred, danger) {
    const j = danger * 3, own = -this.attackSide;
    return { kind: 'linea', t: this.now() + danger * DT, i: danger, bx: pred.pos[j], by: own * (AR.YB - 150), bz: pred.pos[j + 2],
      cx: clamp(pred.pos[j], -AR.W + 150, AR.W - 150), cy: own * (AR.YB - 250), sdx: 0, sdy: this.attackSide, jumped: false };
  }
  aerialFeasible(x, y, z, T) {
    const car = this.car, g = CONFIG.physics.gravity;
    const vz = car.vel.z + 420, pz = car.pos.z + 60;
    const dx = x - (car.pos.x + car.vel.x * T), dy = y - (car.pos.y + car.vel.y * T), dz = z - (pz + vz * T - 0.5 * g * T * T);
    const a = 2 * Math.sqrt(dx * dx + dy * dy + dz * dz) / (T * T);
    const boostNeed = a * T / CONFIG.boost.airAccel * CONFIG.boost.usePerSecond;
    return a < 900 && boostNeed < car.boost - 3;
  }

  acelerar: ['KeyW', 'ArrowUp'], reversa: ['KeyS', 'ArrowDown'], izquierda: ['KeyA', 'ArrowLeft'], derecha: ['KeyD', 'ArrowRight'],
  saltar: ['Space', 'Mouse2'], turbo: ['ShiftLeft', 'Mouse0'], derrape: ['ControlLeft', ''], rollIzq: ['KeyQ', ''], rollDer: ['KeyE', ''],
  camPelota: ['KeyC', ''], reiniciar: ['KeyR', ''], marcador: ['Tab', ''], pausa: ['Escape', 'KeyP'],
};
const Settings = {
  KEY: 'turbo-futbol-ajustes-v1',
  data: null,
  defaults() {
    return {
      bindings: JSON.parse(JSON.stringify(DEFAULT_BINDINGS)),
      deadzone: CONFIG.input.deadzone,
      camera: Object.assign({}, CONFIG.camera),
      audio: Object.assign({}, CONFIG.audio),
      quality: { preset: 'auto', bloom: true },
      playerName: 'Tú',
    };
  },
  load() {
    const d = this.defaults();
    try {
      const raw = window.localStorage && window.localStorage.getItem(this.KEY);
      if (raw) {
        const saved = JSON.parse(raw);
        for (const k of ['deadzone', 'playerName']) if (saved[k] !== undefined) d[k] = saved[k];
        for (const k of ['camera', 'audio', 'quality']) if (saved[k]) Object.assign(d[k], saved[k]);
        if (saved.bindings) for (const a of Object.keys(d.bindings)) if (Array.isArray(saved.bindings[a])) d.bindings[a] = saved.bindings[a].slice(0, 2);
      }
    } catch (e) { /* almacenamiento no disponible: usar valores por defecto */ }
    this.data = d;
    return d;
  },
  save() {
    try { if (window.localStorage) window.localStorage.setItem(this.KEY, JSON.stringify(this.data)); } catch (e) { /* sin almacenamiento */ }
  },
};

// =====================================================================
// ENTRADA — teclado, ratón y gamepad. Se muestrea en cada tick de física (no por frame).
// =====================================================================
function keyLabel(code) {
  if (!code) return '—';
  const map = { Space: 'Espacio', ShiftLeft: 'Shift izq.', ShiftRight: 'Shift der.', ControlLeft: 'Ctrl izq.', ControlRight: 'Ctrl der.',
    AltLeft: 'Alt izq.', AltRight: 'Alt der.', MetaLeft: 'Cmd izq.', MetaRight: 'Cmd der.', Tab: 'Tab', Escape: 'Esc', Enter: 'Enter',
    ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Backspace: 'Retroceso', CapsLock: 'Bloq Mayús',
    Mouse0: 'Clic izq.', Mouse1: 'Clic central', Mouse2: 'Clic der.', Mouse3: 'Ratón 4', Mouse4: 'Ratón 5' };
  if (map[code]) return map[code];
  if (code.startsWith('Key')) return code.slice(3);
  if (code.startsWith('Digit')) return code.slice(5);
  if (code.startsWith('Numpad')) return 'Num ' + code.slice(6);
  return code;
}

const Input = {
  down: new Set(),
  latch: new Set(),
  gameActive: false,
  handlers: [],
  rebinding: null,
  pad: { index: -1, id: '', ps: false, buttons: new Array(17).fill(0), prev: new Array(17).fill(0), axes: [0, 0, 0, 0] },
  init(target) {
    window.addEventListener('keydown', (e) => this.onKeyDown(e));
    window.addEventListener('keyup', (e) => this.onKeyUp(e));
    target.addEventListener('mousedown', (e) => this.onPointerDown('Mouse' + e.button, e));
    window.addEventListener('mouseup', (e) => this.onPointerUp('Mouse' + e.button));
    target.addEventListener('contextmenu', (e) => e.preventDefault());
    window.addEventListener('blur', () => { this.down.clear(); this.latch.clear(); });
  },
  bindings(action) { return (Settings.data && Settings.data.bindings[action]) || []; },
  actionsOf(code) {
    const out = [];
    for (const [a] of ACTIONS) if (this.bindings(a).includes(code)) out.push(a);
    return out;
  },
  onAction(fn) { this.handlers.push(fn); },
  emit(action, pressed, source) { for (const fn of this.handlers) fn(action, pressed, source); },
  onKeyDown(e) {
    if (this.rebinding) { e.preventDefault(); this.finishRebind(e.code); return; }
    const acts = this.actionsOf(e.code);
    // Evita atajos del navegador (espacio, tab, ctrl+tecla…) mientras se juega
    if (acts.length && this.gameActive) e.preventDefault();
    if (e.code === 'Tab') e.preventDefault();
    if (e.repeat) return;
    this.down.add(e.code); this.latch.add(e.code);
    for (const a of acts) this.emit(a, true, 'teclado');
  },
  onKeyUp(e) {
    this.down.delete(e.code);
    for (const a of this.actionsOf(e.code)) this.emit(a, false, 'teclado');
  },
  onPointerDown(code, e) {
    if (this.rebinding) { e.preventDefault(); this.finishRebind(code); return; }
    this.down.add(code); this.latch.add(code);
    for (const a of this.actionsOf(code)) this.emit(a, true, 'raton');
  },
  onPointerUp(code) {
    this.down.delete(code);
    for (const a of this.actionsOf(code)) this.emit(a, false, 'raton');
  },
  startRebind(action, slot, done) { this.rebinding = { action, slot, done }; },
  finishRebind(code) {
    const r = this.rebinding; this.rebinding = null;
    if (!r) return;
    if (code !== 'Escape' || r.action === 'pausa') {
      const b = Settings.data.bindings;
      // Quitar el código de cualquier otra acción para evitar conflictos
      for (const a of Object.keys(b)) b[a] = b[a].map((c) => (c === code ? '' : c));
      b[r.action][r.slot] = code;
      Settings.save();
    }
    if (r.done) r.done();
  },
  held(action) {
    for (const c of this.bindings(action)) if (c && (this.down.has(c) || this.latch.has(c))) return true;
    return false;
  },
  /** Lee el primer gamepad conectado (distribución estándar Xbox / PlayStation). */
  pollPad() {
    const P = this.pad;
    let gp = null;
    const list = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const g of list) if (g && g.connected) { gp = g; break; }
    if (!gp) { if (P.index !== -1) { P.index = -1; P.buttons.fill(0); } return false; }
    P.index = gp.index; P.id = gp.id;
    P.ps = /054c|sony|playstation|dualshock|dualsense/i.test(gp.id);
    for (let i = 0; i < P.buttons.length; i++) {
      P.prev[i] = P.buttons[i];
      const b = gp.buttons[i];
      P.buttons[i] = b ? (typeof b === 'object' ? b.value : b) : 0;
    }
    for (let i = 0; i < 4; i++) P.axes[i] = gp.axes[i] || 0;
    const edges = [[0, 'pad-a'], [1, 'pad-b'], [2, 'pad-x'], [3, 'pad-y'], [8, 'pad-select'], [9, 'pad-start'], [12, 'pad-arriba'], [13, 'pad-abajo'], [14, 'pad-izq'], [15, 'pad-der']];
    for (const [i, name] of edges) {
      const now = P.buttons[i] > 0.5, before = P.prev[i] > 0.5;
      if (now !== before) this.emit(name, now, 'gamepad');
    }
    return true;
  },
  sample(ctl) {
    const hasPad = this.pollPad();
    const k = (a) => (this.held(a) ? 1 : 0);
    let throttle = k('acelerar') - k('reversa');
    let steer = k('derecha') - k('izquierda');
    let pitch = k('reversa') - k('acelerar');
    let roll = k('rollDer') - k('rollIzq');
    let jump = this.held('saltar'), boost = this.held('turbo'), hb = this.held('derrape');
    if (hasPad) {
      const P = this.pad, dz = Settings.data ? Settings.data.deadzone : CONFIG.input.deadzone;
      let lx = P.axes[0], ly = P.axes[1];
      const mag = Math.hypot(lx, ly);
      if (mag < dz) { lx = 0; ly = 0; } else { const s = Math.min(1, (mag - dz) / (1 - dz)) / mag; lx *= s; ly *= s; }
      const trig = (v) => (v < 0.05 ? 0 : (v - 0.05) / 0.95);
      throttle += trig(P.buttons[7]) - trig(P.buttons[6]);
      steer += lx; pitch += ly;
      roll += (P.buttons[5] > 0.5 ? 1 : 0) - (P.buttons[4] > 0.5 ? 1 : 0);
      jump = jump || P.buttons[0] > 0.5;
      boost = boost || P.buttons[1] > 0.5;
      hb = hb || P.buttons[2] > 0.5;
    }
    ctl.throttle = clamp(throttle, -1, 1);
    ctl.steer = clamp(steer, -1, 1);
    ctl.pitch = clamp(pitch, -1, 1);
    const r = clamp(roll, -1, 1);
    if (hb) { ctl.roll = r !== 0 ? r : ctl.steer; ctl.yaw = 0; } else { ctl.roll = r; ctl.yaw = ctl.steer; }
    ctl.jump = jump; ctl.boost = boost; ctl.handbrake = hb;
    this.latch.clear();
    return ctl;
  },
  /** Stick derecho (girar la cámara con el gamepad). */
  rightStick() {
    if (this.pad.index < 0) return [0, 0];
    const dz = 0.2, x = this.pad.axes[2], y = this.pad.axes[3];
    return [Math.abs(x) < dz ? 0 : x, Math.abs(y) < dz ? 0 : y];
  },
};

// PRUEBAS (?test)
// =====================================================================
const Tests = {
  list: [],
  add(name, fn, extra = false) { this.list.push({ name, fn, extra }); },
  async run() {
    const panel = document.getElementById('pruebas');
    panel.classList.remove('oculto');
    document.getElementById('carga').classList.add('oculto');
    panel.innerHTML = '<h1>Turbo Fútbol — pruebas</h1><div class="det">Simulación sin render, paso fijo de ' +
      TICK_RATE + ' Hz.</div><div id="lista-pruebas"></div><div class="resumen" id="resumen-pruebas"></div>';
    const lista = panel.querySelector('#lista-pruebas');
    const results = [];
    for (const test of this.list) {
      const row = document.createElement('div');
      row.className = 'res';
      row.innerHTML = '<span class="corre">… CORRIENDO</span> ' + escapeHtml(test.name);
      lista.appendChild(row);
      await new Promise((r) => setTimeout(r, 10));
      const t0 = performance.now();
      let res;
      try { res = await test.fn(); }
      catch (e) { res = { pass: false, detail: 'Excepción: ' + e.message + '\n' + (e.stack || '') }; }
      const ms = performance.now() - t0;
      results.push({ name: test.name, pass: !!res.pass, detail: res.detail || '', extra: test.extra });
      row.innerHTML = (res.pass ? '<span class="pasa">✔ PASA</span> ' : '<span class="falla">✘ FALLA</span> ') +
        escapeHtml(test.name) + ' <span class="det">(' + ms.toFixed(0) + ' ms)</span>' +
        '<div class="det">' + escapeHtml(res.detail || '') + '</div>';
      console.log((res.pass ? 'PASA' : 'FALLA') + ' — ' + test.name + (res.detail ? ' — ' + res.detail : ''));
    }
    const ok = results.filter((r) => r.pass).length;
    const all = results.length === ok;
    document.getElementById('resumen-pruebas').innerHTML = all
      ? '<span class="pasa">Todas las pruebas PASAN (' + ok + '/' + results.length + ')</span>'
      : '<span class="falla">' + (results.length - ok) + ' prueba(s) FALLAN (' + ok + '/' + results.length + ' pasan)</span>';
    console.log(all ? 'RESUMEN: todas las pruebas PASAN (' + ok + '/' + results.length + ')' : 'RESUMEN: FALLAN ' + (results.length - ok) + ' de ' + results.length);
    window.__tfTestResults = results;
    window.__tfTestsDone = true;
    return results;
  },
};
function escapeHtml(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---- Pruebas adicionales de la SDF de la cancha ----
Tests.add('Extra A. SDF de la cancha: valores conocidos (piso, paredes, curvas, portería, postes)', () => {
  const n = new V3();
  const R = CONFIG.arena.filletRadius;
  const checks = [];
  function chk(label, x, y, z, expD, expN) {
    const d = arenaSDF(x, y, z, n);
    let ok = Math.abs(d - expD) < 0.02;
    if (expN) ok = ok && Math.abs(n.x - expN[0]) < 1e-3 && Math.abs(n.y - expN[1]) < 1e-3 && Math.abs(n.z - expN[2]) < 1e-3;
    checks.push({ label, ok, got: d.toFixed(3) + ' n=(' + n.x.toFixed(3) + ',' + n.y.toFixed(3) + ',' + n.z.toFixed(3) + ')', exp: expD.toFixed(3) });
  }
  chk('piso', 0, 0, 500, 500, [0, 0, 1]);
  chk('techo', 0, 0, 1900, 144, [0, 0, -1]);
  chk('pared lateral', 4000, 0, 1000, 96, [-1, 0, 0]);
  chk('pared de fondo', 2000, 5000, 1000, 120, [0, -1, 0]);
  chk('chaflán', 3000, 4600, 1000, (8064 - 7600) * INV_SQRT2, [-INV_SQRT2, -INV_SQRT2, 0]);
  for (let k = 0; k <= 8; k++) {
    const phi = k / 8 * Math.PI / 2;
    chk('curva piso-pared φ=' + (phi * 180 / Math.PI).toFixed(0) + '°', AR.Xq + R * Math.sin(phi), 0, R - R * Math.cos(phi), 0);
  }
  chk('dentro de la portería (piso)', 0, 5500, 300, 300, [0, 0, 1]);
  chk('boca de la portería (sin pared invisible)', 0, 5120, 300, 300, [0, 0, 1]);
  chk('frente a la boca, junto al piso', 0, 5050, 20, 20, [0, 0, 1]);
  const dp = Math.hypot(892.755 - 800, 20);
  chk('cerca del poste (arista exacta)', 800, 5100, 550, dp);
  chk('bajo el travesaño', 0, 5100, 600, Math.hypot(20, 42.775));
  chk('pared interior de la portería', 850, 5600, 300, 42.755, [-1, 0, 0]);
  chk('fondo de la portería', 0, 5950, 300, 50, [0, -1, 0]);
  chk('techo de la portería', 0, 5600, 600, 42.775, [0, 0, -1]);
  chk('portería azul (espejo)', 0, -5950, 300, 50, [0, 1, 0]);
  chk('penetración en pared lateral', 4110, 0, 1000, -14, [-1, 0, 0]);
  chk('penetración en pared de portería', 900, 5600, 300, -7.245, [-1, 0, 0]);
  const bad = checks.filter((c) => !c.ok);
  return { pass: bad.length === 0, detail: bad.length ? bad.map((c) => c.label + ': obtuvo ' + c.got + ' esperado ' + c.exp).join('\n') : checks.length + ' comprobaciones correctas' };
});

Tests.add('Extra B. SDF de la cancha: continua (Lipschitz 1) y normal = gradiente', () => {
  const rng = new Rng(1234);
  const n = new V3(), n2 = new V3();
  let worstLip = 0, worstGrad = 0, nGrad = 0;
  const samples = 60000;
  for (let i = 0; i < samples; i++) {
    // Muestras concentradas cerca de las porterías y las curvas
    const x = rng.range(-4300, 4300), y = rng.range(-6200, 6200), z = rng.range(-100, 2200);
    const d = arenaSDF(x, y, z, n);
    const h = 0.5 + rng.next() * 40;
    const dx = rng.range(-1, 1), dy = rng.range(-1, 1), dz = rng.range(-1, 1);
    const l = Math.hypot(dx, dy, dz) || 1;
    const d2 = arenaSDF(x + dx / l * h, y + dy / l * h, z + dz / l * h, n2);
    worstLip = Math.max(worstLip, Math.abs(d2 - d) / h);
    // Gradiente numérico (solo en espacio libre y lejos de aristas de la propia SDF)
    if (d > 5 && d < 3000) {
      const e = 0.05;
      const gx = (arenaSDF(x + e, y, z, n2) - arenaSDF(x - e, y, z, n2)) / (2 * e);
      const gy = (arenaSDF(x, y + e, z, n2) - arenaSDF(x, y - e, z, n2)) / (2 * e);
      const gz = (arenaSDF(x, y, z + e, n2) - arenaSDF(x, y, z - e, n2)) / (2 * e);
      const gl = Math.hypot(gx, gy, gz);
      if (gl > 0.99 && gl < 1.01) {
        worstGrad = Math.max(worstGrad, Math.hypot(gx - n.x, gy - n.y, gz - n.z));
        nGrad++;
      }
    }
  }
  const pass = worstLip <= 1.001 && nGrad > 1000;
  // El gradiente puede discrepar en el eje medial (dos superficies equidistantes); se reporta.
  return { pass, detail: 'Lipschitz máx = ' + worstLip.toFixed(5) + ', desviación máx normal/gradiente = ' + worstGrad.toFixed(4) + ' (' + nGrad + ' muestras)' };
});

// ---- Pruebas del auto ----
function testCar(x, y, yaw) {
  const w = new World({ ball: false });
  const car = w.addCar(new Car(0, 0, 'prueba'));
  car.placeAt(x, y, yaw);
  return { w, car };
}
function settle(w, seconds) { for (let i = 0; i < seconds * TICK_RATE; i++) w.step(); }

Tests.add('1. Sin turbo, el auto llega a ~1410 uu/s y no más', () => {
  const { w, car } = testCar(0, -4700, Math.PI / 2);
  settle(w, 0.5);
  car.controls.throttle = 1;
  let maxSpeed = 0, t1400 = -1, finite = true;
  for (let i = 0; i < 6 * TICK_RATE; i++) {
    w.step();
    const sp = car.vel.dot(car.rot.f);
    maxSpeed = Math.max(maxSpeed, car.vel.length());
    if (t1400 < 0 && sp >= 1400) t1400 = (i + 1) * DT;
    finite = finite && car.isFinite();
  }
  const final = car.vel.dot(car.rot.f);
  const pass = finite && final > 1405 && final <= 1410.05 && maxSpeed <= 1410.05 && car.onGround;
  return { pass, detail: 'velocidad final ' + final.toFixed(2) + ' uu/s, máxima ' + maxSpeed.toFixed(2) + ' uu/s, llegó a 1400 uu/s a los ' + t1400.toFixed(2) + ' s' };
});

Tests.add('2. Con turbo llega a 2300 uu/s', () => {
  const { w, car } = testCar(0, -4700, Math.PI / 2);
  settle(w, 0.5);
  car.unlimitedBoost = true;
  car.controls.throttle = 1; car.controls.boost = true;
  let maxSpeed = 0, t2300 = -1, ss = -1;
  for (let i = 0; i < 4 * TICK_RATE; i++) {
    w.step();
    const sp = car.vel.length();
    maxSpeed = Math.max(maxSpeed, sp);
    if (t2300 < 0 && sp >= 2299.5) t2300 = (i + 1) * DT;
    if (ss < 0 && car.supersonic) ss = (i + 1) * DT;
  }
  const pass = maxSpeed >= 2299.5 && maxSpeed <= 2300.01 && car.isFinite();
  return { pass, detail: 'máxima ' + maxSpeed.toFixed(2) + ' uu/s, 2300 a los ' + t2300.toFixed(2) + ' s, supersónico a los ' + ss.toFixed(2) + ' s' };
});

Tests.add('3. Salto con botón completo alcanza la altura calculada ±5%', () => {
  const { w, car } = testCar(0, 0, 0);
  settle(w, 1.0);
  const z0 = car.pos.z;
  const J = CONFIG.jump, g = CONFIG.physics.gravity;
  const vT = J.impulse + (J.holdAccel - g) * J.maxHold;
  const expected = J.impulse * J.maxHold + 0.5 * (J.holdAccel - g) * J.maxHold * J.maxHold + vT * vT / (2 * g);
  car.controls.jump = true;
  let maxZ = z0, tApex = 0;
  for (let i = 0; i < 2 * TICK_RATE; i++) {
    if (i === Math.round(0.3 * TICK_RATE)) car.controls.jump = false;
    w.step();
    if (car.pos.z > maxZ) { maxZ = car.pos.z; tApex = (i + 1) * DT; }
  }
  const rise = maxZ - z0;
  const err = (rise - expected) / expected;
  return { pass: Math.abs(err) <= 0.05, detail: 'subida ' + rise.toFixed(1) + ' uu vs fórmula ' + expected.toFixed(1) + ' uu (' + (err * 100).toFixed(2) + '%), ápice a los ' + tApex.toFixed(3) + ' s' };
});

Tests.add('5. Auto a 1400 uu/s sube por la pared sin caerse ni atravesarla', () => {
  const { w, car } = testCar(1800, 0, 0);
  settle(w, 0.3);
  car.vel.set(1400, 0, 0);
  car.controls.throttle = 1;
  let maxWallZ = 0, minSdf = Infinity, maxX = -Infinity, wallTicks = 0, ceilingTicks = 0, airAfterWall = 0, fell = false, finite = true;
  for (let i = 0; i < 5 * TICK_RATE; i++) {
    w.step();
    finite = finite && car.isFinite();
    minSdf = Math.min(minSdf, hitboxMinSDF(car));
    maxX = Math.max(maxX, car.pos.x);
    const n = car.groundNormal;
    if (car.onGround && n.z < 0.3 && n.z > -0.3) { wallTicks++; maxWallZ = Math.max(maxWallZ, car.pos.z); }
    if (car.onGround && n.z < -0.7) ceilingTicks++;
    if (wallTicks > 0 && !car.onGround) { airAfterWall++; if (airAfterWall > 0.25 * TICK_RATE) fell = true; } else airAfterWall = 0;
  }
  const pass = finite && maxWallZ > 1000 && minSdf > -3 && maxX < 4096 && !fell;
  return { pass, detail: 'altura máx. en pared ' + maxWallZ.toFixed(0) + ' uu, ' + (wallTicks * DT).toFixed(2) + ' s en pared, ' +
    (ceilingTicks * DT).toFixed(2) + ' s en techo, SDF mín. de la caja ' + minSdf.toFixed(2) + ' uu, x máx. ' + maxX.toFixed(0) + (fell ? ', SE CAYÓ' : '') };
});

Tests.add('Extra C. Dodge: impulso ~500 uu/s, anula vz; doble salto sin dirección', () => {
  let { w, car } = testCar(0, 0, 0);
  settle(w, 0.5);
  car.controls.jump = true; w.step(); w.step(); w.step(); car.controls.jump = false;
  for (let i = 0; i < 12; i++) w.step();
  const vzBefore = car.vel.z, vxBefore = car.vel.x;
  car.controls.pitch = -1; car.controls.jump = true; w.step();
  const dvx = car.vel.x - vxBefore, vzAfter = car.vel.z;
  car.controls.jump = false; car.controls.pitch = 0;
  let maxPitchRate = 0;
  for (let i = 0; i < 60; i++) { w.step(); maxPitchRate = Math.max(maxPitchRate, car.angVel.dot(car.rot.l)); }
  const okDodge = Math.abs(dvx - 500) < 30 && Math.abs(vzAfter) < 20 && vzBefore > 50 && maxPitchRate > 5.0 && car.hasFlipped;
  ({ w, car } = testCar(0, 0, 0));
  settle(w, 0.5);
  car.controls.jump = true; w.step(); w.step(); w.step(); car.controls.jump = false;
  for (let i = 0; i < 12; i++) w.step();
  const vz1 = car.vel.z;
  car.controls.jump = true; w.step();
  const dvz = car.vel.z - vz1;
  const okDouble = car.hasDoubleJumped && Math.abs(dvz - (CONFIG.jump.impulse - CONFIG.physics.gravity * DT)) < 5;
  return { pass: okDodge && okDouble, detail: 'dodge: Δvx=' + dvx.toFixed(1) + ' vz antes=' + vzBefore.toFixed(0) + ' después=' + vzAfter.toFixed(1) +

Tests.add('4. Pelota soltada desde 1000 uu rebota con restitución 0.6', () => {
  const w = new World();
  const b = w.ball;
  b.reset(0, 0, 1000);
  const g = CONFIG.physics.gravity, R = CONFIG.ball.radius, drag = Math.pow(1 - CONFIG.ball.drag, DT);
  let ratio = -1, vIn = 0, vOut = 0, bounced = false, maxZ = 0;
  for (let i = 0; i < 6 * TICK_RATE; i++) {
    const vz0 = b.vel.z;
    w.step();
    if (!bounced && b.vel.z > 0 && vz0 <= 0) {
      bounced = true;
      vIn = (vz0 - g * DT) * drag;
      vOut = b.vel.z;
      ratio = vOut / -vIn;
    } else if (bounced && b.vel.z > 0) maxZ = Math.max(maxZ, b.pos.z);
    if (bounced && b.vel.z < 0 && maxZ > 0) break;
  }
  const hRatio = (maxZ - R) / (1000 - R);
  const pass = bounced && Math.abs(ratio - CONFIG.ball.restitution) < 0.005 && Math.abs(hRatio - 0.36) < 0.03;
  return { pass, detail: 'impacto ' + (-vIn).toFixed(1) + ' uu/s → rebote ' + vOut.toFixed(1) + ' uu/s (restitución ' + ratio.toFixed(4) +
    '); altura del rebote ' + (maxZ - R).toFixed(1) + ' de ' + (1000 - R).toFixed(1) + ' uu (' + (hRatio * 100).toFixed(1) + '%, ideal 36% sin arrastre)' };
});

Tests.add('6. La pelota nunca sale de la cancha tras 10 000 golpes aleatorios', () => {
  const w = new World({ seed: 7 });
  const car = w.addCar(new Car(0, 0, 'golpeador'));
  car.placeAt(0, -3000, 0);
  const b = w.ball;
  b.reset(0, 0, 400);
  const rng = new Rng(20240924);
  const R = CONFIG.ball.radius, n = new V3(), dir = new V3();
  let worst = Infinity, maxSpeed = 0, bad = 0, carHits = 0, kicks = 0, inGoal = 0, nan = false, ticks = 0;
  for (let h = 0; h < 10000; h++) {
    // dirección aleatoria uniforme
    const u = rng.range(-1, 1), th = rng.range(0, TAU), r = Math.sqrt(1 - u * u);
    dir.set(r * Math.cos(th), r * Math.sin(th), u);
    const speed = rng.range(300, 6000);
    let usedCar = false;
    if (h % 2 === 1) {
      // golpe con un auto: se coloca detrás de la pelota moviéndose hacia ella
      const cx = b.pos.x - dir.x * (R + 90), cy = b.pos.y - dir.y * (R + 90), cz = b.pos.z - dir.z * (R + 90);
      if (arenaSDF(cx, cy, cz, n) > 90) {
        car.resetState();
        car.pos.set(cx, cy, cz);
        car.rot.setFromForwardUp(dir, Math.abs(dir.z) > 0.9 ? new V3(1, 0, 0) : Z_UP);
        car.prevPos.copy(car.pos); car.prevRot.copy(car.rot);
        car.vel.copy(dir).scale(Math.min(speed, 2300));
        usedCar = true; carHits++;
      }
    }
    if (!usedCar) {
      b.vel.copy(dir).scale(speed);
      b.angVel.set(rng.range(-6, 6), rng.range(-6, 6), rng.range(-6, 6));
      kicks++;
    }
    const steps = 2 + rng.int(30);
    for (let t = 0; t < steps; t++) {
      w.step(); ticks++;
      if (!b.isFinite() || !car.isFinite()) { nan = true; break; }
      const d = arenaSDF(b.pos.x, b.pos.y, b.pos.z, n);
      worst = Math.min(worst, d);
      maxSpeed = Math.max(maxSpeed, b.vel.length());
      if (d < 0 || Math.abs(b.pos.x) > CONFIG.arena.halfWidth || Math.abs(b.pos.y) > AR.YG || b.pos.z < 0 || b.pos.z > AR.H) bad++;
      if (Math.abs(b.pos.y) > AR.YB + R) inGoal++;
    }
    if (nan) break;
    if (usedCar) { car.placeAt(0, -3000, 0); }
  }
  const pass = !nan && bad === 0 && worst > 0 && maxSpeed <= CONFIG.ball.maxSpeed + 1e-6;
  return { pass, detail: kicks + ' golpes directos + ' + carHits + ' golpes con auto, ' + ticks + ' ticks; distancia mínima del centro a la superficie ' +
    worst.toFixed(2) + ' uu (radio ' + R + '); ticks fuera: ' + bad + '; ticks dentro de porterías: ' + inGoal + '; vel. máx ' + maxSpeed.toFixed(0) + (nan ? '; ¡NaN!' : '') };
});
