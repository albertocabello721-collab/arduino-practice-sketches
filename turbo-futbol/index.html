const DebugViz = {
  line: null, marker: null, predictor: null, lastTick: -100, targets: [],
  init() {
    const n = 120;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
    this.line = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: 0xffe066, depthTest: false, transparent: true }));
    this.line.renderOrder = 30; this.line.frustumCulled = false;
    this.marker = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.ball.radius * INV_UU, 16, 12),
      new THREE.MeshBasicMaterial({ color: 0xffe066, wireframe: true, depthTest: false, transparent: true }));
    this.marker.renderOrder = 30;
    this.targetMarkers = [];
    R.scene.add(this.line, this.marker);
    this.predictor = new BallPredictor(4);
  },
  update(world, sharedPrediction) {
    const on = Debug.on && world && world.ballEnabled;
    this.line.visible = on; this.marker.visible = on;
    for (const m of this.targetMarkers) m.visible = false;
    if (!on) return;
    let pred = sharedPrediction;
    if (!pred) {
      if (world.tick - this.lastTick >= 6 || world.tick < this.lastTick) { this.predictor.compute(world.ball, world.tick); this.lastTick = world.tick; }
      pred = this.predictor;
    }
    const pos = this.line.geometry.getAttribute('position');
    const n = pos.count, step = Math.max(1, Math.floor(pred.n / (n - 1)));
    for (let i = 0; i < n; i++) {
      const j = Math.min(pred.n, i * step) * 3;
      toThree(pred.pos[j], pred.pos[j + 1], pred.pos[j + 2], R.tmpV);
      pos.setXYZ(i, R.tmpV.x, R.tmpV.y, R.tmpV.z);
    }
    pos.needsUpdate = true;
    // Punto predicho: primer rebote en el piso (o la posición a 1.5 s)
    let k = Math.round(1.5 * TICK_RATE);
    for (let i = 2; i < pred.n; i++) {
      if (pred.vel[i * 3 + 2] > 0 && pred.vel[(i - 1) * 3 + 2] <= 0 && pred.pos[i * 3 + 2] < CONFIG.ball.radius + 40) { k = i; break; }
    }
    k = Math.min(k, pred.n);
    toThree(pred.pos[k * 3], pred.pos[k * 3 + 1], pred.pos[k * 3 + 2], this.marker.position);
    // Objetivos de los bots
    let mi = 0;
    for (const t of this.targets) {
      if (!this.targetMarkers[mi]) {
        const m = new THREE.Mesh(new THREE.OctahedronGeometry(40 * INV_UU), new THREE.MeshBasicMaterial({ color: 0xff55ff, depthTest: false, transparent: true }));
        m.renderOrder = 31; R.scene.add(m); this.targetMarkers.push(m);
      }
      const m = this.targetMarkers[mi++];
      m.visible = true; m.material.color.set(t.color);
      toThree(t.x, t.y, t.z, m.position);
    }
  },
};

// Cámara del jugador: cámara de pelota / cámara de auto, sin atravesar paredes
// ---------------------------------------------------------------------
const CameraRig = {
  pos: new V3(), look: new V3(), up: new V3(0, 0, 1), heading: new V3(0, 1, 0), elev: 0,
  ballCam: true, inited: false, shakeAmp: 0, shakeTime: 0, swivel: 0,
  _w: new V3(), _t: new V3(), _d: new V3(), _n: new V3(), _hit: { t: 0, x: 0, y: 0, z: 0, nx: 0, ny: 0, nz: 0 },
  reset() { this.inited = false; },
  addShake(a) { if (Settings.data.camera.shake) this.shakeAmp = Math.max(this.shakeAmp, a); },
  update(dt, carPos, carRot, carOnGround, ballPos, carSpeed) {
    const S = Settings.data.camera;
    const w = this._w, t = this._t;
    // "Arriba" de la cámara: sigue la superficie en paredes/techo, vuelve al mundo en el aire (sin giros bruscos)
    const tu = carOnGround ? carRot.u : Z_UP;
    if (!this.inited) this.up.copy(tu);
    const ku = 1 - Math.exp(-3.5 * dt);
    this.up.x += (tu.x - this.up.x) * ku; this.up.y += (tu.y - this.up.y) * ku; this.up.z += (tu.z - this.up.z) * ku;
    this.up.normalize();
    const U = this.up;
    // Dirección deseada
    const useBall = this.ballCam && ballPos;
    if (useBall) w.subVectors(ballPos, carPos);
    else {
      w.copy(carRot.f);
      if (Math.abs(w.dot(U)) > 0.92) w.copy(carRot.u).scale(-Math.sign(carRot.f.dot(U)));
    }
    let wantElev = 0;
    const along = w.dot(U);
    w.addScaled(U, -along);
    const planar = w.length();
    if (useBall) wantElev = Math.atan2(along, Math.max(planar, 1));
    if (planar > 1e-3) w.scale(1 / planar); else w.copy(this.heading);
    if (!this.inited) { this.heading.copy(w); this.elev = wantElev; this.inited = true; }
    // Suavizado del rumbo según la rigidez (rápido = poco retraso)
    this.heading.addScaled(U, -this.heading.dot(U));
    if (this.heading.lengthSq() < 1e-6) this.heading.copy(w); else this.heading.normalize();
    const rate = lerp(5, 26, clamp(S.stiffness, 0, 1)) * (useBall ? S.transition : 1);
    const k = 1 - Math.exp(-rate * dt);
    const dotHW = clamp(this.heading.dot(w), -1, 1);
    if (dotHW < -0.999) { t.crossVectors(U, this.heading); this.heading.addScaled(t, 0.05).normalize(); }
    this.heading.x += (w.x - this.heading.x) * k; this.heading.y += (w.y - this.heading.y) * k; this.heading.z += (w.z - this.heading.z) * k;
    this.heading.addScaled(U, -this.heading.dot(U)).normalize();
    this.elev += (wantElev - this.elev) * (1 - Math.exp(-6 * dt));
    // Giro manual con el stick derecho
    const rs = Input.rightStick();
    this.swivel += ((rs[0] * Math.PI * 0.9) - this.swivel) * (1 - Math.exp(-10 * dt));
    const H = this._d.copy(this.heading);
    if (Math.abs(this.swivel) > 1e-3) { t.crossVectors(U, H); const c = Math.cos(this.swivel), s = Math.sin(this.swivel); H.scale(c).addScaled(t, -s).normalize(); }
    // Posición: detrás del auto; en cámara de pelota baja un poco cuando la pelota sube
    const ang = S.angle * Math.PI / 180;
    const camElev = clamp(this.elev, -0.25, 1.1) * 0.42;
    const dist = S.distance * (1 + (1 - S.stiffness) * 0.18 * clamp(carSpeed / 2300, 0, 1));
    const ce = Math.cos(camElev), se = Math.sin(camElev);
    this.pos.copy(carPos).addScaled(U, S.height).addScaled(H, -dist * ce).addScaled(U, -dist * se);
    // Mirada
    const lookElev = ang + (useBall ? clamp(this.elev, -0.4, 1.25) * 0.72 : 0);
    this.look.copy(H).scale(Math.cos(lookElev)).addScaled(U, Math.sin(lookElev));
    // Anticolisión: acercar la cámara si una pared se interpone
    const fx = carPos.x + U.x * S.height * 0.6, fy = carPos.y + U.y * S.height * 0.6, fz = carPos.z + U.z * S.height * 0.6;
    const dx = this.pos.x - fx, dy = this.pos.y - fy, dz = this.pos.z - fz;
    const len = Math.sqrt(dx * dx + dy * dy + dz * dz);
    const margin = 32;
    if (len > 1) {
      const ux = dx / len, uy = dy / len, uz = dz / len;
      if (arenaRaycast(fx, fy, fz, ux, uy, uz, len + margin, this._hit, margin * 0.5) && this._hit.t < len + margin) {
        const tt = Math.max(15, this._hit.t - margin);
        this.pos.set(fx + ux * tt, fy + uy * tt, fz + uz * tt);
      }
    }
    for (let i = 0; i < 3; i++) {
      const d = arenaSDF(this.pos.x, this.pos.y, this.pos.z, this._n);
      if (d >= margin * 0.6) break;
      this.pos.addScaled(this._n, margin * 0.6 - d);
    }
    // Sacudida
    if (this.shakeAmp > 0.01) {
      this.shakeTime += dt;
      const a = this.shakeAmp;
      this.pos.x += Math.sin(this.shakeTime * 71) * a; this.pos.y += Math.sin(this.shakeTime * 83 + 1) * a; this.pos.z += Math.sin(this.shakeTime * 97 + 2) * a;
      this.shakeAmp *= Math.exp(-4 * dt);
    }
  },
  apply(cam) {
    const S = Settings.data.camera;
    toThree(this.pos.x, this.pos.y, this.pos.z, cam.position);
    toThree(this.up.x, this.up.y, this.up.z, cam.up, 1);
    toThree(this.pos.x + this.look.x * 100, this.pos.y + this.look.y * 100, this.pos.z + this.look.z * 100, R.tmpV);
    cam.lookAt(R.tmpV);
    const vfov = 2 * Math.atan(Math.tan(S.fov * Math.PI / 360) / cam.aspect) * 180 / Math.PI;
    const f = clamp(vfov, 30, 125);
    if (Math.abs(cam.fov - f) > 1e-3) { cam.fov = f; cam.updateProjectionMatrix(); }
  },
};

const FreeCam = {
  pos: new V3(0, -8200, 1900), yaw: Math.PI / 2, pitch: -0.22, keys: new Set(), drag: false, lx: 0, ly: 0, active: false,
  init() {
    const c = R.renderer.domElement;
    window.addEventListener('keydown', (e) => {
      this.keys.add(e.code);
      if (e.code === 'F4') { e.preventDefault(); this.active = !this.active; Input.gameActive = !this.active && Game.playing(); }
    });
    window.addEventListener('keyup', (e) => this.keys.delete(e.code));
    c.addEventListener('mousedown', (e) => { this.drag = true; this.lx = e.clientX; this.ly = e.clientY; });
    window.addEventListener('mouseup', () => { this.drag = false; });
    window.addEventListener('mousemove', (e) => {
      if (!this.drag) return;
      this.yaw -= (e.clientX - this.lx) * 0.004;
      this.pitch = clamp(this.pitch - (e.clientY - this.ly) * 0.004, -1.5, 1.5);
      this.lx = e.clientX; this.ly = e.clientY;
    });
  },
  update(dt) {
    const k = this.keys, sp = (k.has('ShiftLeft') ? 4000 : 1400) * dt;
    const fx = Math.cos(this.yaw), fy = Math.sin(this.yaw);
    if (k.has('KeyW')) { this.pos.x += fx * sp; this.pos.y += fy * sp; }
    if (k.has('KeyS')) { this.pos.x -= fx * sp; this.pos.y -= fy * sp; }
    if (k.has('KeyA')) { this.pos.x -= fy * sp; this.pos.y += fx * sp; }
    if (k.has('KeyD')) { this.pos.x += fy * sp; this.pos.y -= fx * sp; }
    if (k.has('KeyE')) this.pos.z += sp;
    if (k.has('KeyQ')) this.pos.z -= sp;
  },
  apply(cam) {
    toThree(this.pos.x, this.pos.y, this.pos.z, cam.position);
    const cp = Math.cos(this.pitch);
    const t = toThree(this.pos.x + Math.cos(this.yaw) * cp, this.pos.y + Math.sin(this.yaw) * cp, this.pos.z + Math.sin(this.pitch), R.tmpV);
    cam.up.set(0, 1, 0);
    cam.lookAt(t);
  },
};

const Main = {
  last: 0, running: false,
  start() {
    this.running = true;
    this.last = performance.now();
    requestAnimationFrame((t) => this.frame(t));
  },
  frame(now) {
    if (!this.running) return;
    try {
      const dt = Math.min((now - this.last) / 1000, 0.1);
      this.last = now;
      Debug.frame(dt);
      const G = Game;
      if (G.playing()) {
        G.acc += dt;
        let n = 0;
        while (G.acc >= DT && n < CONFIG.physics.maxTicksPerFrame) { G.tick(); G.acc -= DT; n++; }
        if (n >= CONFIG.physics.maxTicksPerFrame) G.acc = 0;
      }
      const alpha = clamp(G.acc / DT, 0, 1);
      G.time += dt;
      for (const v of G.views) v.update(alpha);
      if (G.ballView) G.ballView.update(alpha);
      if (G.padsView) G.padsView.update(G.time);
      if (FreeCam.active || !G.player) {
        FreeCam.update(dt);
        FreeCam.apply(R.camera);
      } else {
        const v = G.views[0];
        CameraRig.update(dt, v.renderPos, v.renderRot, G.player.onGround, G.ballView ? G.ballView.renderPos : null, G.player.vel.length());
        CameraRig.apply(R.camera);
      }
      DebugViz.update(G.world, null);
      R.renderer.render(R.scene, R.camera);
      if (Debug.on) Debug.update(debugLines());
      requestAnimationFrame((t) => this.frame(t));
    } catch (err) {
      this.running = false;
      window.__tfMostrarError('Error en el bucle del juego', err.message, err.stack);
    }
  },
};

function debugLines() {
  const lines = ['FPS: ' + Debug.fps.toFixed(1) + '   draw calls: ' + R.renderer.info.render.calls + '   triángulos: ' + R.renderer.info.render.triangles];
  const car = Game.player;
  if (car) {
    const sp = car.vel.length();
    lines.push('Velocidad: ' + sp.toFixed(0) + ' uu/s' + (car.supersonic ? '  (SUPERSÓNICO)' : ''));
    lines.push('Turbo: ' + car.boost.toFixed(1) + (car.boosting ? '  (usando)' : ''));
    lines.push('Estado: ' + (car.onGround ? 'SUELO' : 'AIRE') + '  ruedas en contacto: ' + car.numContacts + '  normal: (' +
      car.groundNormal.x.toFixed(2) + ', ' + car.groundNormal.y.toFixed(2) + ', ' + car.groundNormal.z.toFixed(2) + ')');
    lines.push('Saltos disponibles: ' + car.jumpsAvailable() + (car.isFlipping ? '  (dodge ' + car.flipTime.toFixed(2) + ' s)' : '') + (car.hasDoubleJumped ? '  (doble salto usado)' : ''));
    lines.push('Derrape: ' + (car.handbrakeAmt * 100).toFixed(0) + '%   giro: ' + car.angVel.length().toFixed(2) + ' rad/s');
    lines.push('Posición: ' + car.pos.x.toFixed(0) + ', ' + car.pos.y.toFixed(0) + ', ' + car.pos.z.toFixed(0));
  }
  if (Game.world && Game.world.ballEnabled) {
    const b = Game.world.ball;
    lines.push('Pelota: ' + b.vel.length().toFixed(0) + ' uu/s  giro ' + b.angVel.length().toFixed(2) + ' rad/s  pos ' + b.pos.x.toFixed(0) + ', ' + b.pos.y.toFixed(0) + ', ' + b.pos.z.toFixed(0));
    lines.push('Cámara: ' + (CameraRig.ballCam ? 'pelota' : 'auto') + '   (amarillo: trayectoria y punto predicho)');
  }
  if (FreeCam.active) {
    const d = arenaSDF(FreeCam.pos.x, FreeCam.pos.y, FreeCam.pos.z, _dbgN);
    lines.push('Cámara libre (F4): ' + FreeCam.pos.x.toFixed(0) + ', ' + FreeCam.pos.y.toFixed(0) + ', ' + FreeCam.pos.z.toFixed(0) + '  SDF ' + d.toFixed(0));
  }
  return lines;
}

async function boot() {
  const params = new URLSearchParams(location.search);
  window.__TFT = { CONFIG, World, Car, Ball, BallPredictor, Controls, V3, Basis, arenaSDF, arenaRaycast, hitboxMinSDF, AR, DT, TICK_RATE };
  if (params.has('test')) {
    window.__tfArrancado = true;
    await Tests.run();
    return;
  }
  try {
    const [three, ec, rp, ub, op, re, bgu] = await Promise.all([
      import('three'),
      import('three/addons/postprocessing/EffectComposer.js'),
      import('three/addons/postprocessing/RenderPass.js'),
      import('three/addons/postprocessing/UnrealBloomPass.js'),
      import('three/addons/postprocessing/OutputPass.js'),
      import('three/addons/environments/RoomEnvironment.js'),
      import('three/addons/utils/BufferGeometryUtils.js'),
    ]);
    THREE = three; EffectComposer = ec.EffectComposer; RenderPass = rp.RenderPass;
    UnrealBloomPass = ub.UnrealBloomPass; OutputPass = op.OutputPass; RoomEnvironment = re.RoomEnvironment;
    mergeGeometries = bgu.mergeGeometries;
  } catch (err) {
    window.__tfMostrarError('No se pudo cargar Three.js',
      'Falló la descarga de los módulos desde cdn.jsdelivr.net. Revisa tu conexión a internet.\n' + err.message, err.stack);
    return;
  }
  Settings.load();
  initRenderer();
  initRenderTemps();
  buildSky();
  buildLights();
  buildArena();
  Input.init(R.renderer.domElement);
  FreeCam.init();
  Debug.init();
  DebugViz.init();
  CameraRig.ballCam = Settings.data.camera.ballCam;
  Game.startSandbox();
  document.getElementById('carga').classList.add('oculto');
  window.__TF = { CONFIG, FreeCam, arenaSDF, R, V3, Game, Input, CameraRig, Settings };
  window.__tfArrancado = true;
  Main.start();
}

boot().catch((err) => window.__tfMostrarError('No se pudo iniciar el juego', err.message, err.stack));
</script>
